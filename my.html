<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>로컬피드 시작하기</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="a.css?v=1126h">
</head>
<body>
<div class="phone">
  <div class="brand"><img src="icons/logo.svg" alt=""><b>로컬피드</b><span>LocalFeed</span></div>
  <div class="top"><h1 id="h1">불러오는 중…</h1><p id="sub"></p></div>
  <div id="app"></div>
  <p class="foot">비밀번호는 어디에도 적지 않아요. 연결은 언제든 끊을 수 있어요.<br><b>로컬피드</b> · 동네 가게 SNS를 대신 올려 드려요<br><a href="index.html">로컬피드 안내</a> · <a href="#" id="logout">로그아웃</a> · <a href="privacy.html">개인정보처리방침</a></p>
</div>
<script src="config.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), LS=window.localStorage;
  function get(k){try{return LS.getItem(k)}catch(e){return null}}
  function set(k,v){try{LS.setItem(k,v)}catch(e){}}
  var store=q.get('store')||get('lf_store'), key=q.get('key')||get('lf_key');
  if(q.get('store')&&q.get('key')){set('lf_store',store);set('lf_key',key);history.replaceState(null,'',location.pathname);}
  var app=document.getElementById('app'), h1=document.getElementById('h1'), sub=document.getElementById('sub');
  var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent), dev=mobile?'m':'p', S=null, online=false, forced=null, rec=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var CHECK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON={note:'<path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',store:'<path d="M4 10v10h16V10M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/>'};
  function svg(n){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>'}
  var LOGO={ig:'instagram.png',th:'threads.svg',dg:'daangn.png',tt:'tiktok.svg',bl:'naver-blog.png'};
  function tile(kind,done,big){
    if(done) return '<div class="tile done'+(big?' big':'')+'">'+CHECK+'</div>';
    if(LOGO[kind]) return '<div class="tile logo'+(big?' big':'')+'"><img src="icons/'+LOGO[kind]+'" alt=""></div>';
    return '<div class="tile'+(big?' big':'')+'">'+svg(kind)+'</div>';
  }
  function norm(r){ r.files=r.files||{store:0,face:0,voice:0}; r.steps.voice=r.steps.voice||'todo'; r.steps.intro=r.steps.intro||'done'; r.intro=r.intro||{}; return r; }
  function fail(t){h1.textContent='화면을 열 수 없어요';sub.textContent=t;app.innerHTML='';}
  if(!store||!key){location.replace('start.html');return;}
  function out(){ try{LS.removeItem('lf_store');LS.removeItem('lf_key');}catch(e){} location.replace('start.html#login'); }

  // 단계 정의: id, 아이콘, 제목, 한 줄 설명, 끝났는지, 열 수 있는지
  function steps(){
    var s=S.steps;
    return [
      {id:'place',ic:'store',t:'매장 정보',d:'네이버 플레이스 주소 붙여넣기',done:s.place==='done'},
      {id:'intro',ic:'note',t:'가게 소개',d:s.intro==='done'?(S.intro.dong+' · '+S.intro.industry+' · 눌러서 고치기'):'무엇을 파는지, 누가 오는지 · 2분',done:s.intro==='done',reopen:true},
      {id:'photos',ic:'image',t:'매장 사진과 대표님 얼굴',d:s.photos==='later'?'나중에 보내기로 했어요 · 눌러서 보내기':'매장 '+S.files.store+'장 · 얼굴 '+S.files.face+'장'+(s.photos==='done'?' · 눌러서 더 보내기':''),done:s.photos!=='todo',later:s.photos==='later',reopen:true},
      {id:'voice',ic:'mic',t:'대표님 목소리',d:s.voice==='skip'?'목소리는 쓰지 않아요 · 눌러서 바꾸기':s.voice==='later'?'나중에 보내기로 했어요 · 눌러서 녹음하기':s.voice==='done'?'녹음 '+S.files.voice+'개 받았어요':'30초만 읽어 주세요 (선택)',done:s.voice!=='todo',later:s.voice==='later',reopen:true},
      {id:'blog',ic:'bl',t:'블로그 주소',d:'붙여넣기만 하면 돼요',done:s.blog==='done'},
      {id:'daangn',ic:'dg',t:'당근 운영자로 초대하기',d:s.daangn==='sent'?'로컬피드가 수락하는 중이에요':'초대 링크 보내기',done:s.daangn==='done',wait:s.daangn==='sent'},
      {id:'igbiz',ic:'ig',t:'인스타를 비즈니스 계정으로',d:'무료 · 게시물과 팔로워는 그대로',done:s.igbiz==='done'},
      {id:'ig',ic:'ig',t:'인스타 연결',d:s.igbiz==='done'&&s.tester!=='done'?'로컬피드가 준비하는 중 · 보통 10분':'초대 수락 후 연결',done:s.ig==='done',wait:s.igbiz==='done'&&s.tester!=='done',lock:s.igbiz!=='done'},
      {id:'th',ic:'th',t:'스레드 연결',d:'초대 수락 후 연결',done:s.th==='done',lock:s.tester!=='done'},
      {id:'tt',ic:'tt',t:'틱톡 연결',d:S.ttOpen?'연결 누르고 허용':'준비되면 알려드려요',done:s.tt==='done',lock:!S.ttOpen}
    ];
  }
  function save(field,value,btn){
    var m=document.getElementById('msg'); if(m) m.textContent='';
    if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='보내는 중…';}
    return lfApi({action:'owner_save',store:store,key:key,field:field,value:value}).then(function(r){
      if(!r.ok) throw new Error(r.error); S=norm(r); render();
    }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;} if(m) m.textContent=e.message; });
  }
  var EX='https://d2ol7oe51mr4n9.cloudfront.net/user_3HMG7NwHVDNp5QwWEFS4eKzc3Dg/';
  function why(t,imgs){
    var pics=(imgs||[]).map(function(x){return '<figure><img src="'+EX+x[0]+'" alt="" onerror="this.parentNode.remove()"><figcaption>'+x[1]+'</figcaption></figure>';}).join('');
    return '<div class="why"><b>왜 필요한가요?</b><p>'+t+'</p>'+(pics?'<div class="ex">'+pics+'</div><small>예시 · 샘플 매장으로 만든 것</small>':'')+'</div>';
  }
  // 찍는 법 안내 그림 (직접 그린 단순한 그림)
  function fig(inner){return '<svg viewBox="0 0 80 100" fill="none" stroke="#2B64F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';}
  var FACE1=fig('<circle cx="40" cy="38" r="17"/><path d="M12 96c2-18 14-26 28-26s26 8 28 26"/><path d="M34 36v2M46 36v2M35 45c3 3 7 3 10 0"/>');
  var FACE2=fig('<ellipse cx="42" cy="38" rx="15" ry="17"/><path d="M12 96c2-18 14-26 28-26s26 8 28 26"/><path d="M42 36v2M51 36v2M43 45c2 2 5 2 7 0M55 38l3 4-3 1"/>');
  var FACE3=fig('<circle cx="40" cy="26" r="12"/><path d="M8 98c0-26 12-44 32-44s32 18 32 44"/><path d="M36 24v1.5M44 24v1.5M35 30c3 4 7 4 10 0"/><path d="M40 54v20"/>');
  var IC2={store:'<path d="M14 44v40h52V44M10 44l6-20h48l6 20a10 10 0 0 1-20 0 10 10 0 0 1-20 0 10 10 0 0 1-20 0zM32 84V62h16v22"/>',room:'<path d="M10 30l30-14 30 14v54H10zM10 66h60M28 66V46h24v20"/>',star:'<path d="M40 18l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>',hand:'<path d="M22 84V52l12-8V26a5 5 0 0 1 10 0v18l14 4a8 8 0 0 1 6 8v28"/>',list:'<rect x="16" y="14" width="48" height="72" rx="6"/><path d="M26 32h28M26 46h28M26 60h18"/>'};
  function ICO(k){return fig(IC2[k]);}
  function shot(svgs,t,d){return '<figure>'+svgs+'<figcaption><b>'+t+'</b>'+(d?'<br>'+d:'')+'</figcaption></figure>';}
  // AI로 만든 예시 사진 (가상의 인물·가게). 한 장에 나란히 붙인 그림에서 칸만 잘라 보여 준다.
  var GF=EX+'0678a2ad-ee90-43d1-aedf-0fa5abbc53fc.jpg', GS=EX+'7756a8d3-f68d-44a4-8db9-54e741fec9b1.jpg';
  function ph(url,n,i,ratio){return '<div class="ph" style="aspect-ratio:'+ratio+';background-image:url('+url+');background-size:'+(n*100)+'% 100%;background-position:'+(n>1?i*100/(n-1):0)+'% 0"></div>';}
  function head(n,st,subt){return '<div class="head">'+tile(st.ic,false,true)+'<div><div class="n">'+n+'번째</div><h2>'+st.t+'</h2><p>'+subt+'</p></div></div>';}
  function body(st,n){
    var c='', id=st.id;
    if(id==='place'){
      c=head(n,st,'지도에 나오는 주소, 영업시간, 가격을 그대로 가져와요')+why('가격이나 영업시간을 틀리게 쓰면 손님이 헛걸음해요. 지도에 적힌 그대로 가져와서 글마다 맞는지 확인해요.')+
        '<ol class="ol"><li>네이버 지도에서 대표님 매장을 찾아요</li><li><b>공유</b>를 눌러 주소를 복사해요</li><li>아래 칸에 붙여넣어요</li></ol>'+
        '<input class="in" id="v" placeholder="https://naver.me/… 또는 https://map.naver.com/…" inputmode="url"><p class="msg" id="msg"></p>'+
        '<div class="stack"><button class="btn" id="go">저장하기</button><button class="btn gray" id="toOnline">지도에 등록 안 했어요 (온라인 매장)</button></div>';
      if(online) c=head(n,st,'온라인으로 파시는 곳이면 이렇게 알려 주세요')+
        '<input class="in" id="v" placeholder="판매하는 곳 주소 (스마트스토어, 자사몰, 인스타 등)" inputmode="url">'+
        '<textarea class="in" id="intro" style="margin-top:8px" placeholder="무엇을 파는지, 가격대, 상담·배송 시간을 한두 줄 적어 주세요"></textarea><p class="msg" id="msg"></p>'+
        '<div class="stack"><button class="btn" id="go">저장하기</button><button class="btn gray" id="toPlace">네이버 지도 주소로 할게요</button></div>';
    }else if(id==='intro'){
      var I=S.intro||{};
      function fld(idn,label,ph,val,area){ return '<label class="fld"><span>'+label+'</span>'+(area?'<textarea class="in" id="'+idn+'" placeholder="'+ph+'">'+esc(val||'')+'</textarea>':'<input class="in" id="'+idn+'" placeholder="'+ph+'" value="'+esc(val||'')+'">')+'</label>'; }
      c=head(n,st,'이걸 보고 같은 동네, 같은 업종을 먼저 조사해요')+
        why('글을 쓰기 전에 대표님 동네의 같은 업종에서 반응이 좋았던 글을 먼저 찾아봐요. 무엇을 파는지, 누가 오는지를 알아야 엉뚱한 주제가 안 나와요.')+
        fld('i_ind','무슨 가게인가요?','예: 미용실, 네일샵, 빵집',I.industry)+
        fld('i_dong','어느 동네인가요?','예: 망원동 (온라인만 하시면 "온라인")',I.dong||(S.online?'온라인':''))+
        fld('i_menu','대표 메뉴·서비스 3가지쯤 (가격은 있으면 같이)','예: 커트 25,000원 / 펌 90,000원부터 · 가격을 안 밝히는 업종은 서비스 이름만',I.menu,true)+
        fld('i_cus','주로 어떤 손님이 오시나요?','예: 30~40대 직장인 여성, 근처 주민',I.customer)+
        fld('i_str','우리 가게만의 자랑 한 줄','예: 1인 예약제라 기다리지 않아요',I.strong)+
        fld('i_like','닮고 싶은 가게나 계정 (선택)','예: 인스타 @○○헤어, 옆 동네 ○○베이커리',I.like)+
        '<label class="fld"><span>대표님이 직접 쓴 글 2~3개 (선택)</span><textarea class="in" id="i_sample" style="min-height:110px" placeholder="예전에 인스타나 당근, 카톡 공지에 올린 글을 그대로 붙여 주세요. 말투를 따라 써서 대표님이 쓴 글처럼 만들어요.">'+esc(I.sample||'')+'</textarea></label>'+
        '<p class="msg" id="msg"></p><button class="btn" id="go">저장하기</button>';
    }else if(id==='photos'){
      var agreed=S.steps.photos==='done';
      c=head(n,st,'남의 사진이 아니라 대표님 가게 사진으로 만들어요')+
        why('가게 사진이 들어가야 손님이 "아, 거기" 하고 알아봐요. 얼굴 사진 한 장으로는 대표님이 직접 말하는 12초 영상을 만들어요. 영상에는 AI로 만들었다는 표시가 붙어요.',[['26796baf-f39d-4ed2-990c-11f057e4102b.jpg','매장 사진 → 카드뉴스'],['d54ad1cb-e978-45fa-8ada-8fe9a2756814.jpg','얼굴 사진 → 12초 영상']])+
        '<div class="sub"><h3>대표님 얼굴 사진 3장</h3><div class="shots">'+shot(ph(GF,3,0,'2/3'),'① 정면','카메라를 똑바로')+shot(ph(GF,3,1,'2/3'),'② 살짝 옆','고개를 조금 돌려서')+shot(ph(GF,3,2,'2/3'),'③ 상반신','웃는 얼굴로')+'</div><p class="ainote">예시 사진은 AI로 만든 가상의 인물이에요</p>'+
        '<ul class="tips"><li>창가처럼 밝은 곳에서, 혼자 찍어요</li><li>모자·마스크·선글라스는 벗고, 보정 앱은 쓰지 않아요</li><li>세 장이 비슷한 날, 비슷한 머리와 옷이면 영상이 자연스러워요</li></ul>'+
        '<div class="up"><div><b>얼굴 사진 보내기</b><small>지금 '+S.files.face+' / 3장</small></div><label class="btn sm sec">사진 고르기<input type="file" accept="image/*" multiple hidden data-up="face"></label></div></div>'+
        '<div class="sub"><h3>매장 사진 10장쯤</h3><div class="shots five">'+shot(ph(GS,5,0,'4/5'),'간판·외관','')+shot(ph(GS,5,1,'4/5'),'내부 전체','')+shot(ph(GS,5,2,'4/5'),'대표 메뉴·시술·상품','3장 이상')+shot(ph(GS,5,3,'4/5'),'일하는 모습','')+shot(ph(GS,5,4,'4/5'),'가격표·메뉴판','')+'</div><p class="ainote">예시 사진은 AI로 만든 가상의 가게예요</p>'+
        '<ul class="tips"><li>가로보다 세로로 찍으면 카드뉴스에 잘 맞아요</li><li>손님 얼굴이 나온 사진은 빼 주세요</li></ul>'+
        '<div class="up"><div><b>매장 사진 보내기</b><small>지금 '+S.files.store+'장</small></div><label class="btn sm sec">사진 고르기<input type="file" accept="image/*" multiple hidden data-up="store"></label></div></div>'+
        '<p class="msg" id="upmsg" style="color:var(--s)"></p>'+
        (agreed?'':'<label class="check"><input type="checkbox" id="v"><span>보낸 사진과 제 얼굴을 로컬피드가 만드는 제 매장 카드뉴스·영상에 쓰는 데 동의해요. 다른 곳에는 쓰지 않고, 언제든 그만 쓰게 하거나 지워 달라고 할 수 있어요.</span></label>')+
        '<p class="msg" id="msg"></p><div class="stack">'+(agreed?'<button class="btn" id="close">다 보냈어요</button>':'<button class="btn" id="go">동의하고 보내기</button><button class="btn gray" id="later">나중에 보낼게요</button>')+'</div>';
    }else if(id==='voice'){
      var vdone=S.steps.voice==='done';
      c=head(n,st,'자막만 있는 영상보다 대표님 목소리가 있으면 더 오래 봐요')+
        why('가게에 왔을 때 듣던 목소리가 영상에서도 나오면 손님이 낯설어하지 않아요. 30초 녹음으로 대표님 목소리를 만들어, 대표님 매장 영상의 대본을 읽는 데만 써요. 원하지 않으시면 자막만 넣어요.')+
        '<div class="sub"><h3>이 글을 편하게 읽어 주세요</h3><p class="script">안녕하세요, '+esc(S.store.name)+'입니다. 오늘도 찾아 주셔서 감사합니다. 날이 많이 추워졌죠. 오시는 길 조심하시고요, 궁금한 건 언제든 편하게 물어봐 주세요. 예약은 미리 해 주시면 기다리지 않고 바로 도와드릴 수 있어요. 그럼 가게에서 뵙겠습니다.</p>'+
        '<div class="stack"><button class="btn sec" id="recBtn">'+(rec&&rec.on?'녹음 끝내기':'녹음 시작')+'</button><audio id="recPlay" controls hidden style="width:100%"></audio><button class="btn" id="recSend" hidden>이 녹음 보내기</button>'+

  function upmsg(t,bad){var e=document.getElementById('upmsg'); if(e){e.textContent=t;e.style.color=bad?'var(--bad)':'var(--s)';}}
  function shrink(file){ return new Promise(function(res,rej){ var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){ var k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]}); };
    img.onerror=function(){rej(new Error('사진을 읽지 못했어요. 다른 사진으로 해 주세요.'));}; img.src=u; }); }

        mr.onstop=function(){ stream.getTracks().forEach(function(t){t.stop();}); rec={on:false,blob:new Blob(chunks,{type:mr.mimeType||'audio/webm'})}; render(); };

  // 완성본: 로컬피드가 보낸 글과 이미지를 보고 좋아요 / 고쳐 주세요
  var fixW=null, CHS=[['인스타 캡션','인스타그램'],['스레드 글','스레드'],['당근 글','당근'],['틱톡 제목·설명','틱톡'],['블로그 글','네이버 블로그']];
  function workItem(c,open){ var okd=/^확정|^게시/.test(c.status), fx=/^수정/.test(c.status), d=String(c.date).split('-'), wait=/^매장 확인/.test(c.status);
    var texts=CHS.filter(function(h){return c.text[h[0]];});
    var one=function(h){ return '<div class="wt"><div class="wh"><b>'+h[1]+'</b>'+(h[0]==='블로그 글'?'<button class="link" data-copyw="'+esc(c.id)+'">글 복사</button>':'')+'</div><p>'+esc(c.text[h[0]])+'</p></div>'; };
    return '<details class="pl"'+(open?' open':'')+'><summary><span class="pf">'+(+d[1])+'월 '+(+d[2])+'일에 올라가요</span><b>'+esc(c.title)+'</b><span class="ps">'+(/^게시 완료/.test(c.status)?'<span class="chip ok">올라갔어요</span>':okd?'<span class="chip ok">좋아요</span>':fx?'<span class="chip warn">고치는 중</span>':'<span class="chip soft">확인 전</span>')+'</span></summary>'+
      (c.media.length?'<div class="wm">'+c.media.map(function(u){return /\.mp4($|\?)/.test(u)?'<video src="'+esc(u)+'" controls preload="none"></video>':'<img src="'+esc(u)+'" loading="lazy" alt="">';}).join('')+'</div>':'')+
      (texts.length?one(texts[0]):'')+
      (texts.length>1?'<details class="more"><summary>다른 채널 글 '+(texts.length-1)+'개 보기</summary>'+texts.slice(1).map(one).join('')+'</details>':'')+
      (fx&&c.ownerMemo?'<small>보내신 말: '+esc(c.ownerMemo)+'</small>':'')+
      (fixW===c.id?'<textarea class="in" id="fixWT" placeholder="예: 글이 너무 길어요. 사진을 바꿔 주세요" style="min-height:76px;margin-top:8px"></textarea><p class="msg" id="fixWM"></p><div class="stack"><button class="btn" data-wfixgo="'+esc(c.id)+'">이렇게 고쳐 주세요</button><button class="btn gray" data-wfixno="1">취소</button></div>'
        :wait?'<div class="stack" style="margin-top:10px"><button class="btn" data-wok="'+esc(c.id)+'">좋아요, 올려 주세요</button><button class="btn gray" data-wfix="'+esc(c.id)+'">고쳐 주세요</button></div>':'')+
      '</details>'; }
  function worksCard(){
    var W=(S.works||[]).slice().reverse(); if(!W.length) return '';
    var wait=W.filter(function(c){return /^매장 확인/.test(c.status)}), rest=W.filter(function(c){return !/^매장 확인/.test(c.status)});
    var html='';
    if(wait.length) html+='<div class="card"><b style="font-size:17px">올라갈 글을 봐 주세요</b><small style="display:block;color:var(--s);font-size:13px;margin:4px 0 6px">'+wait.length+'건 · 좋아요를 누른 것만 올라가요</small>'+wait.map(function(c,i){return workItem(c,i===0||fixW===c.id);}).join('')+'</div>';
    if(rest.length) html+='<details class="card fold"'+(fixW&&rest.some(function(c){return c.id===fixW})?' open':'')+'><summary><span><b>확인한 글 '+rest.length+'건</b><small>정해진 날에 올라가요</small></span><em>보기</em></summary>'+rest.map(function(c){return workItem(c,false);}).join('')+'</details>';
    return html;
  }
  function md(d){var p=String(d||'').split('-');return p.length===3?(+p[1])+'월 '+(+p[2])+'일':'';}
  function planCard(){
    var p=S.plan; if(!p) return ''; if(p.status==='시작 전') return '<div class="card plan"><span class="chip soft">신청 접수됨</span><span>로컬피드가 확인하면 무료 체험 3주가 시작돼요. 아래는 먼저 해 두셔도 돼요</span></div>';
    var t,s2,cls='soft';
    if(p.status==='무료 체험'){ if(p.over){t='무료 체험이 끝났어요';s2='계속 이용하시려면 로컬피드에 알려 주세요';cls='warn';} else {t='무료 체험 중 · '+(p.left===0?'오늘까지':p.left+'일 남았어요');s2=md(p.trialEnd)+'까지 무료예요';} }
    else if(p.status==='유료'){ t='이용 중';s2='다음 결제일 '+md(p.nextPay)+(p.fee?' · 월 '+esc(p.fee):''); cls=p.over?'warn':'ok'; if(p.over) t='결제일이 지났어요'; }
    else { t='이용이 멈춰 있어요';s2='다시 시작하시려면 로컬피드에 알려 주세요';cls='warn'; }
    return '<div class="card plan"><span class="chip '+cls+'">'+t+'</span><span>'+s2+'</span></div>';
  }
  function render(){
    var st=steps(), done=st.filter(function(x){return x.done}).length, total=st.length;
    var cur=null,i; for(i=0;i<st.length;i++){ if(st[i].id===forced){cur=i;break;} }
    if(cur===null) for(i=0;i<st.length;i++){ if(!st[i].done&&!st[i].lock&&!st[i].wait){cur=i;break;} }
    if(cur===null) for(i=0;i<st.length;i++){ if(!st[i].done&&st[i].wait){cur=i;break;} }
    document.title=S.store.name+' · 로컬피드';
    if(done===total){ var nW=(S.works||[]).filter(function(c){return /^매장 확인/.test(c.status)}).length, nP=(S.plans||[]).filter(function(p){return /^대기/.test(p.owner)}).length;
      if(nW+nP){h1.innerHTML='대표님, 확인할 것이<br>'+(nW+nP)+'건 있어요';sub.textContent=S.store.name+' · 좋아요만 눌러 주시면 돼요';}
      else if((S.works||[]).length||(S.plans||[]).length){h1.innerHTML='대표님, 지금은<br>하실 일이 없어요';sub.textContent=S.store.name+' · 다음 확인이 생기면 알려드릴게요';}
      else {h1.innerHTML='대표님, 준비가 다 됐어요';sub.textContent=S.store.name+' · 첫 기획이 나오면 알려드릴게요';} }
    else{h1.innerHTML='대표님, 처음 한 번만 해 주시면<br>나머지는 저희가 해요';sub.textContent=S.store.name+' · 처음 한 번만';}
    var allDone=done===total&&cur===null&&!forced;
    var html=planCard()+loginCard()+worksCard()+plansCard()+(allDone?'':svc(done,total))+(allDone?'':'<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:15px">'+done+' / '+total+' 완료</b><span style="font-size:13px;color:var(--s)">'+(done===total?'모두 끝났어요':'아래 줄을 누르면 순서를 바꿔 할 수 있어요')+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div></div>');
    function rows(list){return '<div class="card tight">'+list.map(function(x){
      var chip=x.s.later?'<span class="chip warn">나중에</span>':x.s.done?'<span class="chip ok">완료</span>':x.s.wait?'<span class="chip warn">기다리는 중</span>':'<span class="chip">다음</span>';
      var name=x.s.id==='ig'&&S.igName?S.igName:x.s.id==='th'&&S.thName?S.thName:x.s.id==='tt'&&S.ttName?S.ttName:x.s.d;
      return '<div class="row'+(x.s.done?'':' dim')+'"'+(!x.s.lock?' data-open="'+x.s.id+'" style="cursor:pointer"':'')+'>'+tile(x.s.ic,x.s.done&&!x.s.later)+'<div class="g"><b>'+x.s.t+'</b><small>'+esc(x.s.done&&name?name:x.s.d)+'</small></div>'+chip+'</div>';
    }).join('')+'</div>';}
    var before=[],after=[];
    st.forEach(function(s,i){ if(i===cur) return; (cur===null||i<cur?before:after).push({s:s,i:i}); });
    if(allDone){ var later=st.filter(function(s){return s.later}).length;
      html+='<details class="card fold"><summary><span><b>처음 설정 '+done+' / '+total+' 완료</b><small>'+(later?'나중에 보내기로 한 것 '+later+'가지가 있어요':'연결과 가게 정보를 고칠 수 있어요')+'</small></span><em>보기</em></summary>'+rows(before).replace('class="card tight"','class="tight"')+'</details>'; }
    else {
    if(before.length) html+=rows(before);
    if(cur!==null) html+='<div class="card">'+body(st[cur],cur+1)+'</div>';
    if(after.length) html+=rows(after);
    }
    app.innerHTML=html;
    var go=document.getElementById('go'), v=document.getElementById('v');
    var codeEl=document.getElementById('code');
    function pick(){ if(!codeEl||codeEl.value) return; var t=v.value.replace(/https?:\/\/\S+/g,' '); var x=t.match(/코드[^A-Za-z0-9]{0,12}([A-Za-z0-9]{6})(?![A-Za-z0-9])/)||t.match(/(?:^|[^A-Za-z0-9])(\d{6})(?![A-Za-z0-9])/); if(x) codeEl.value=x[1]; }
    if(codeEl){ v.addEventListener('input',pick); v.addEventListener('paste',function(){setTimeout(pick,0);}); }
    if(go&&cur!==null){ var id=st[cur].id; go.onclick=function(){
      if(id!=='photos'&&id!=='voice') forced=null;
      var val=!v?'':id==='photos'?(v.checked?'agree':''):v.value;
      if(id==='daangn'){ pick(); val='코드:'+codeEl.value.trim()+' '+v.value; }
      if(id==='place'&&online){ id2='online'; val=v.value.trim()+'\n'+document.getElementById('intro').value; }
      if(id==='photos'||id==='voice'){ val=v&&v.checked?'agree':''; forced=null; }
      if(id==='intro'){ var G=function(x){return document.getElementById(x).value;}; val=JSON.stringify({industry:G('i_ind'),dong:G('i_dong'),menu:G('i_menu'),customer:G('i_cus'),strong:G('i_str'),like:G('i_like'),sample:G('i_sample')}); forced=null; }
      save(id2||id, val, go); }; }
    [].forEach.call(document.querySelectorAll('[data-open]'),function(r){r.onclick=function(){forced=r.dataset.open;render();window.scrollTo(0,0);};});
    var cl=document.getElementById('close'); if(cl) cl.onclick=function(){forced=null;render();};
    var lt=document.getElementById('later'); if(lt&&cur!==null) lt.onclick=function(){forced=null;save(st[cur].id,'later',lt);};
    var sk=document.getElementById('skipV'); if(sk) sk.onclick=function(){forced=null;save('voice','skip',sk);};
    [].forEach.call(document.querySelectorAll('[data-up]'),function(inp){inp.onchange=function(){upload(inp.dataset.up,[].slice.call(inp.files));};});
    recUI();
    var id2=null, a1=document.getElementById('toOnline'), a2=document.getElementById('toPlace'), a3=document.getElementById('skipDg');
    if(a1) a1.onclick=function(){online=true;render();};
    if(a2) a2.onclick=function(){online=false;render();};
    if(a3) a3.onclick=function(){ if(window.confirm('당근에는 올리지 않을까요? 나중에 다시 켤 수 있어요.')) save('daangn_skip','1',a3); };
    var none=document.getElementById('none'); if(none) none.onclick=function(){save('blog','없음',none);};
    var rl=document.getElementById('reload'); if(rl) rl.onclick=load;
    function workCall(b,id,ok,memo,M){ b.disabled=true; lfApi({action:'owner_work',store:store,key:key,id:id,ok:ok,memo:memo}).then(function(r){ if(!r.ok) throw new Error(r.error); fixW=null; S=norm(r); render(); }).catch(function(e){ b.disabled=false; if(M) M.textContent=e.message; else window.alert(e.message); }); }
    [].forEach.call(document.querySelectorAll('[data-wok]'),function(b){b.onclick=function(){workCall(b,b.dataset.wok,'1','');};});
    [].forEach.call(document.querySelectorAll('[data-wfix]'),function(b){b.onclick=function(){fixW=b.dataset.wfix;render();var t=document.getElementById('fixWT'); if(t) t.focus();};});
    [].forEach.call(document.querySelectorAll('[data-wfixno]'),function(b){b.onclick=function(){fixW=null;render();};});
    [].forEach.call(document.querySelectorAll('[data-wfixgo]'),function(b){b.onclick=function(){workCall(b,b.dataset.wfixgo,'0',document.getElementById('fixWT').value,document.getElementById('fixWM'));};});
    [].forEach.call(document.querySelectorAll('[data-copyw]'),function(b){b.onclick=function(ev){ ev.preventDefault(); var c=(S.works||[]).filter(function(x){return x.id===b.dataset.copyw})[0]; if(!c) return; var t=c.text['블로그 글']; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='복사했어요';},function(){window.prompt('아래 글을 복사해 주세요',t);}); };});
    var wk=document.getElementById('wkB'); if(wk) wk.onclick=function(){ var M=document.getElementById('wkM'); wk.disabled=true; lfApi({action:'owner_save',store:store,key:key,field:'weeknote',value:document.getElementById('wkN').value}).then(function(r){ if(!r.ok) throw new Error(r.error); S=norm(r); render(); var m2=document.getElementById('wkM'); if(m2){ m2.style.color='var(--ok)'; m2.textContent='저장했어요. 이번 주 글에 넣을게요.'; } }).catch(function(e){ M.textContent=e.message; wk.disabled=false; }); };
    function planCall(b,row,ok,memo,M){ b.disabled=true; lfApi({action:'owner_plan',store:store,key:key,row:row,ok:ok,memo:memo}).then(function(r){ if(!r.ok) throw new Error(r.error); fixRow=null; S=norm(r); render(); }).catch(function(e){ b.disabled=false; if(M) M.textContent=e.message; else window.alert(e.message); }); }
    [].forEach.call(document.querySelectorAll('[data-pok]'),function(b){b.onclick=function(){planCall(b,b.dataset.pok,'1','');};});
    [].forEach.call(document.querySelectorAll('[data-pfix]'),function(b){b.onclick=function(){fixRow=+b.dataset.pfix;render();var t=document.getElementById('fixT'); if(t) t.focus();};});
    [].forEach.call(document.querySelectorAll('[data-pfixno]'),function(b){b.onclick=function(){fixRow=null;render();};});
    [].forEach.call(document.querySelectorAll('[data-pfixgo]'),function(b){b.onclick=function(){planCall(b,b.dataset.pfixgo,'0',document.getElementById('fixT').value,document.getElementById('fixM'));};});
    var lg=document.getElementById('lgB'); if(lg) lg.onclick=function(){ var M=document.getElementById('lgM'); M.textContent=''; lg.disabled=true;
      lfApi({action:'owner_setlogin',store:store,key:key,phone:document.getElementById('lgP').value,pin:document.getElementById('lgN').value}).then(function(r){ if(!r.ok) throw new Error(r.error); S=norm(r); render(); }).catch(function(e){ M.textContent=e.message; lg.disabled=false; }); };
    [].forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){dev=b.dataset.d;render();};});
  }
  function load(){
    return lfApi({action:'owner_state',store:store,key:key}).then(function(r){ if(!r.ok) throw new Error(r.error); S=norm(r); render(); })
      .catch(function(e){ if(S) return; if(/확인 링크|등록되지 않은/.test(e.message)){ out(); return; } fail(e.message); });
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S) load(); });
  document.getElementById('logout').onclick=function(ev){ ev.preventDefault(); if(window.confirm('로그아웃할까요?')) out(); };
  load();
})();
</script>
</body>
</html>
