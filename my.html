<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>로컬피드 시작하기</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="a.css">
</head>
<body>
<div class="phone">
  <div class="brand"><img src="icons/logo.svg" alt=""><b>로컬피드</b><span>LocalFeed</span></div>
  <div class="top"><h1 id="h1">불러오는 중…</h1><p id="sub"></p></div>
  <div id="app"></div>
  <p class="foot">비밀번호는 어디에도 적지 않아요. 연결은 언제든 끊을 수 있어요.<br><b>로컬피드</b> · 동네 가게 SNS를 대신 올려 드려요<br><a href="index.html">로컬피드 안내</a> · <a href="privacy.html">개인정보처리방침</a></p>
</div>
<script src="config.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), LS=window.localStorage;
  function get(k){try{return LS.getItem(k)}catch(e){return null}}
  function set(k,v){try{LS.setItem(k,v)}catch(e){}}
  var store=q.get('store')||get('lf_store'), key=q.get('key')||get('lf_key');
  if(q.get('store')&&q.get('key')){set('lf_store',store);set('lf_key',key);history.replaceState(null,'',location.pathname);}
  var app=document.getElementById('app'), h1=document.getElementById('h1'), sub=document.getElementById('sub');
  var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent), dev=mobile?'m':'p', S=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var CHECK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON={store:'<path d="M4 10v10h16V10M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/>'};
  function svg(n){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>'}
  var LOGO={ig:'instagram.png',th:'threads.svg',dg:'daangn.png',tt:'tiktok.svg',bl:'naver-blog.png'};
  function tile(kind,done,big){
    if(done) return '<div class="tile done'+(big?' big':'')+'">'+CHECK+'</div>';
    if(LOGO[kind]) return '<div class="tile logo'+(big?' big':'')+'"><img src="icons/'+LOGO[kind]+'" alt=""></div>';
    return '<div class="tile'+(big?' big':'')+'">'+svg(kind)+'</div>';
  }
  function fail(t){h1.textContent='화면을 열 수 없어요';sub.textContent=t;app.innerHTML='';}
  if(!store||!key){fail('로컬피드가 보내드린 전용 링크로 다시 들어와 주세요.');return;}

  // 단계 정의: id, 아이콘, 제목, 한 줄 설명, 끝났는지, 열 수 있는지
  function steps(){
    var s=S.steps;
    return [
      {id:'place',ic:'store',t:'매장 정보',d:'네이버 플레이스 주소 붙여넣기',done:s.place==='done'},
      {id:'photos',ic:'image',t:'사진과 얼굴 동의',d:'매장 사진 10장 · 대표님 사진 1장',done:s.photos==='done'},
      {id:'blog',ic:'bl',t:'블로그 주소',d:'붙여넣기만 하면 돼요',done:s.blog==='done'},
      {id:'daangn',ic:'dg',t:'당근 운영자로 초대하기',d:s.daangn==='sent'?'로컬피드가 수락하는 중이에요':'초대 링크 보내기',done:s.daangn==='done',wait:s.daangn==='sent'},
      {id:'igbiz',ic:'ig',t:'인스타를 비즈니스 계정으로',d:'무료 · 게시물과 팔로워는 그대로',done:s.igbiz==='done'},
      {id:'ig',ic:'ig',t:'인스타 연결',d:s.igbiz==='done'&&s.tester!=='done'?'로컬피드가 준비하는 중 · 보통 10분':'초대 수락 후 연결',done:s.ig==='done',wait:s.igbiz==='done'&&s.tester!=='done',lock:s.igbiz!=='done'},
      {id:'th',ic:'th',t:'스레드 연결',d:'초대 수락 후 연결',done:s.th==='done',lock:s.tester!=='done'},
      {id:'tt',ic:'tt',t:'틱톡 연결',d:S.ttOpen?'연결 누르고 허용':'준비되면 알려드려요',done:s.tt==='done',lock:!S.ttOpen}
    ];
  }
  function save(field,value,btn){
    var m=document.getElementById('msg'); if(m) m.textContent='';
    if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='보내는 중…';}
    return lfApi({action:'owner_save',store:store,key:key,field:field,value:value}).then(function(r){
      if(!r.ok) throw new Error(r.error); S=r; render();
    }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;} if(m) m.textContent=e.message; });
  }
  function head(n,st,subt){return '<div class="head">'+tile(st.ic,false,true)+'<div><div class="n">'+n+'번째</div><h2>'+st.t+'</h2><p>'+subt+'</p></div></div>';}
  function body(st,n){
    var c='', id=st.id;
    if(id==='place'){
      c=head(n,st,'지도에 나오는 주소, 영업시간, 가격을 그대로 가져와요')+
        '<ol class="ol"><li>네이버 지도에서 대표님 매장을 찾아요</li><li><b>공유</b>를 눌러 주소를 복사해요</li><li>아래 칸에 붙여넣어요</li></ol>'+
        '<input class="in" id="v" placeholder="https://naver.me/… 또는 https://map.naver.com/…" inputmode="url"><p class="msg" id="msg"></p><button class="btn" id="go">저장하기</button>';
    }else if(id==='photos'){
      c=head(n,st,'카드뉴스와 영상에 쓸 사진이에요')+
        '<ol class="ol"><li>매장 안팎 사진 10장쯤과 대표님 얼굴 사진 1장을 골라요</li><li>로컬피드 담당자 카톡으로 보내 주세요</li></ol>'+
        '<label class="check"><input type="checkbox" id="v"><span>보낸 사진과 제 얼굴을 로컬피드가 만드는 카드뉴스·영상에 쓰는 데 동의해요. 영상에는 AI로 만들었다는 표시가 붙어요. 언제든 그만 쓰게 할 수 있어요.</span></label>'+
        '<p class="msg" id="msg"></p><button class="btn" id="go">사진 보냈고 동의해요</button>';
    }else if(id==='blog'){
      c=head(n,st,'매주 블로그에 올릴 글을 써 드려요')+
        '<input class="in" id="v" placeholder="https://blog.naver.com/아이디" inputmode="url"><p class="msg" id="msg"></p>'+
        '<div class="stack"><button class="btn" id="go">저장하기</button><button class="btn gray" id="none">블로그가 없어요</button></div>';
    }else if(id==='daangn'){
      if(st.wait) return head(n,st,'로컬피드가 수락하면 여기가 완료로 바뀌어요')+'<button class="btn gray" id="reload">새로고침</button>';
      c=head(n,st,'로컬피드가 대표님 가게 소식을 대신 올려요')+
        '<ol class="ol"><li>당근 앱 → 나의 당근 → <b>비즈프로필</b></li><li><b>설정 → 운영자 관리 → 운영자 추가</b></li><li><b>초대 링크</b>와 <b>초대 코드 6자리</b>가 같이 나와요. 복사하고 여기로 돌아와요</li><li>아래 첫 칸을 길게 눌러 <b>붙여넣기</b>. 코드가 자동으로 안 들어가면 둘째 칸에 직접 적어요</li></ol>'+
        '<textarea class="in" id="v" placeholder="복사한 초대 링크를 여기에 붙여 주세요"></textarea>'+
        '<input class="in" id="code" style="margin-top:8px;letter-spacing:2px" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="초대 코드 6자리">'+
        '<p class="msg" id="msg"></p><button class="btn" id="go">로컬피드에 보내기</button>'+
        '<p class="foot">비즈프로필이 아직 없으면 로컬피드에 알려 주세요. 같이 만들어요.</p>';
    }else if(id==='igbiz'){
      var m='<li>인스타 앱 → 프로필 → 오른쪽 위 ≡ → <b>설정 및 활동</b></li><li>아래로 내려 <b>프로필 유형 및 도구</b></li><li><b>프로페셔널 프로필로 전환</b> → 카테고리 고르기 → <b>비즈니스</b></li><li>연락처는 <b>사용 안 함</b>, Facebook 연결은 <b>건너뛰기</b></li>';
      var p='<li>instagram.com → 왼쪽 아래 ≡ → 설정 → <b>프로필 유형 및 도구</b></li><li><b>비즈니스</b> 화면에서 다음 → 카테고리 고르기 → 완료</li><li>"프로페셔널 프로필로 전환하시겠어요?" → <b>계속하기</b></li><li>연락처는 <b>사용 안 함</b> → 완료</li>';
      c=head(n,st,'무료 · 게시물과 팔로워는 그대로 · 언제든 되돌려요')+
        '<div class="seg"><button data-d="m" class="'+(dev==='m'?'on':'')+'">휴대폰</button><button data-d="p" class="'+(dev==='p'?'on':'')+'">PC</button></div>'+
        '<ol class="ol">'+(dev==='m'?m:p)+'</ol>'+
        '<div class="caution"><span>계정이 공개로 바뀌어요. 개인 계정만 있다면 가게용 계정을 새로 만드는 걸 권해요.</span></div>'+
        '<input class="in" id="v" placeholder="인스타 아이디 (예: gyeol_hair)" autocapitalize="off" autocomplete="off" value="'+esc(S.igId)+'"><p class="msg" id="msg"></p><button class="btn" id="go">비즈니스로 전환했어요</button>';
    }else if(id==='ig'){
      if(st.wait) return head(n,st,'로컬피드가 준비를 마치면 여기가 열려요. 보통 10분 안이에요.')+'<button class="btn gray" id="reload">새로고침</button>';
      c=head(n,st,'버튼 두 개만 누르면 끝나요')+
        '<div class="sub"><h3>① 초대 수락하기</h3><ol class="ol"><li>아래 버튼을 누르면 인스타가 열려요</li><li>맨 오른쪽 <b>테스터 초대</b> 탭</li><li><b>LocalFeed-IG</b> → <b>수락</b></li></ol><div class="caution"><span>초대가 안 보이면 가게 계정(@'+esc(S.igId)+')으로 로그인돼 있는지 확인해 주세요</span></div><a class="btn sec" target="_blank" rel="noopener" href="https://www.instagram.com/accounts/manage_access/">초대 수락하러 가기</a></div>'+
        '<div class="sub"><h3>② 연결하기</h3><ol class="ol"><li><b>Instagram으로 계속하기</b>를 눌러요 (Facebook 아님)</li><li>영어 화면이 나오면 <b>아래쪽 파란 버튼</b>만 눌러요</li></ol><div class="caution"><span>Cancel은 누르지 않아요</span></div><a class="btn" href="meta-connect.html?store='+encodeURIComponent(store)+'&ch=ig">인스타 연결하기</a></div>';
    }else if(id==='th'){
      c=head(n,st,'인스타와 같은 순서예요')+
        '<div class="sub"><h3>① 초대 수락하기</h3><ol class="ol"><li>스레드 → ≡ → 설정 → <b>계정</b> → <b>웹사이트 권한</b></li><li>맨 오른쪽 <b>초대</b> 탭</li><li><b>LocalFeed</b> → 검은 <b>수락</b> 버튼</li></ol><a class="btn sec" target="_blank" rel="noopener" href="https://www.threads.com/">스레드 열기</a></div>'+
        '<div class="sub"><h3>② 연결하기</h3><a class="btn" href="meta-connect.html?store='+encodeURIComponent(store)+'&ch=th">스레드 연결하기</a></div>'+
        '<p class="foot">스레드를 안 쓰신다면 인스타 아이디로 한 번 로그인만 하면 만들어져요.</p>';
    }else if(id==='tt'){
      c=head(n,st,'영상은 틱톡 초안함으로 보내 드려요. 게시는 대표님이 눌러요.')+
        '<a class="btn" href="connect.html?store='+encodeURIComponent(store)+'">틱톡 연결하기</a>';
    }
    return c;
  }
  function md(d){var p=String(d||'').split('-');return p.length===3?(+p[1])+'월 '+(+p[2])+'일':'';}
  function planCard(){
    var p=S.plan; if(!p||p.status==='시작 전') return '';
    var t,s2,cls='soft';
    if(p.status==='무료 체험'){ if(p.over){t='무료 체험이 끝났어요';s2='계속 이용하시려면 로컬피드에 알려 주세요';cls='warn';} else {t='무료 체험 중 · '+(p.left===0?'오늘까지':p.left+'일 남았어요');s2=md(p.trialEnd)+'까지 무료예요';} }
    else if(p.status==='유료'){ t='이용 중';s2='다음 결제일 '+md(p.nextPay)+(p.fee?' · 월 '+esc(p.fee):''); cls=p.over?'warn':'ok'; if(p.over) t='결제일이 지났어요'; }
    else { t='이용이 멈춰 있어요';s2='다시 시작하시려면 로컬피드에 알려 주세요';cls='warn'; }
    return '<div class="card plan"><span class="chip '+cls+'">'+t+'</span><span>'+s2+'</span></div>';
  }
  function render(){
    var st=steps(), done=st.filter(function(x){return x.done}).length, total=st.length;
    var cur=null,i; for(i=0;i<st.length;i++){ if(!st[i].done&&!st[i].lock&&!st[i].wait){cur=i;break;} }
    if(cur===null) for(i=0;i<st.length;i++){ if(!st[i].done&&st[i].wait){cur=i;break;} }
    document.title=S.store.name+' · 로컬피드';
    if(done===total){h1.innerHTML='대표님, 준비가 다 됐어요';sub.textContent=S.store.name+' · 첫 기획이 나오면 알려드릴게요';}
    else{h1.innerHTML='대표님, '+total+'가지만 해 주시면<br>나머지는 저희가 해요';sub.textContent=S.store.name+' · 처음 한 번만';}
    var html=planCard()+'<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:15px">'+done+' / '+total+' 완료</b><span style="font-size:13px;color:var(--s)">'+(done===total?'모두 끝났어요':'하나씩 차례로 해요')+'</span></div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div></div>';
    function rows(list){return '<div class="card tight">'+list.map(function(x){
      var chip=x.s.done?'<span class="chip ok">완료</span>':x.s.wait?'<span class="chip warn">기다리는 중</span>':'<span class="chip">다음</span>';
      var name=x.s.id==='ig'&&S.igName?S.igName:x.s.id==='th'&&S.thName?S.thName:x.s.id==='tt'&&S.ttName?S.ttName:x.s.d;
      return '<div class="row'+(x.s.done?'':' dim')+'">'+tile(x.s.ic,x.s.done)+'<div class="g"><b>'+x.s.t+'</b><small>'+esc(x.s.done&&name?name:x.s.d)+'</small></div>'+chip+'</div>';
    }).join('')+'</div>';}
    var before=[],after=[];
    st.forEach(function(s,i){ if(i===cur) return; (cur===null||i<cur?before:after).push({s:s,i:i}); });
    if(before.length) html+=rows(before);
    if(cur!==null) html+='<div class="card">'+body(st[cur],cur+1)+'</div>';
    if(after.length) html+=rows(after);
    app.innerHTML=html;
    var go=document.getElementById('go'), v=document.getElementById('v');
    var codeEl=document.getElementById('code');
    function pick(){ if(!codeEl||codeEl.value) return; var t=v.value.replace(/https?:\/\/\S+/g,' '); var x=t.match(/코드[^A-Za-z0-9]{0,12}([A-Za-z0-9]{6})(?![A-Za-z0-9])/)||t.match(/(?:^|[^A-Za-z0-9])(\d{6})(?![A-Za-z0-9])/); if(x) codeEl.value=x[1]; }
    if(codeEl){ v.addEventListener('input',pick); v.addEventListener('paste',function(){setTimeout(pick,0);}); }
    if(go&&cur!==null){ var id=st[cur].id; go.onclick=function(){
      var val=id==='photos'?(v.checked?'agree':''):v.value;
      if(id==='daangn'){ pick(); val='코드:'+codeEl.value.trim()+' '+v.value; }
      save(id, val, go); }; }
    var none=document.getElementById('none'); if(none) none.onclick=function(){save('blog','없음',none);};
    var rl=document.getElementById('reload'); if(rl) rl.onclick=load;
    [].forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){dev=b.dataset.d;render();};});
  }
  function load(){
    return lfApi({action:'owner_state',store:store,key:key}).then(function(r){ if(!r.ok) throw new Error(r.error); S=r; render(); })
      .catch(function(e){ if(!S) fail(e.message); });
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S) load(); });
  load();
})();
</script>
</body>
</html>
