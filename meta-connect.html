<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>인스타그램 · 스레드 연결 · 로컬피드 LocalFeed</title>
<link rel="stylesheet" href="style.css">
<style>
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px}
.big{display:inline-block;color:#fff;border:0;border-radius:999px;padding:16px 28px;font-weight:800;font-size:17px;cursor:pointer}
.ig{background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af)}
.th{background:#000}
.err{color:#b3261e}
</style>
</head>
<body>
<header>
  <div class="wrap"><nav><a class="logo" href="index.html">Local<b>Feed</b></a></nav></div>
</header>
<main class="wrap">
  <h1 id="h">인스타그램 연결하기</h1>
  <p id="store"></p>
  <div class="box">
    <p><b>로컬피드가 요청하는 권한</b></p>
    <ul id="perm"></ul>
    <p>로컬피드는 비밀번호를 받지 않습니다. 팔로워 목록이나 메시지는 읽지 않습니다. 연결은 언제든 직접 끊을 수 있습니다.</p>
    <button class="big" id="go">연결하기</button>
    <p id="msg"></p>
  </div>
  <div class="en"><p id="en"></p></div>
</main>
<script src="config.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var store=q.get('store'), ch=q.get('ch')==='th'?'th':'ig';
  var T={
    ig:{h:'인스타그램 연결하기',btn:'인스타그램으로 연결하기',cls:'ig',
        perm:['기본 프로필(계정 이름, 프로필 사진): 어느 계정이 연결됐는지 확인하려고 씁니다.','콘텐츠 게시: 사장님이 확인 페이지에서 승인한 카드뉴스와 영상만 정해진 날에 올립니다.'],
        en:'Connect your Instagram professional account. LocalFeed requests instagram_basic and instagram_content_publish, and only publishes posts you approved on the LocalFeed review page.'},
    th:{h:'스레드 연결하기',btn:'스레드로 연결하기',cls:'th',
        perm:['기본 프로필(계정 이름, 프로필 사진): 어느 계정이 연결됐는지 확인하려고 씁니다.','글 게시: 사장님이 확인 페이지에서 승인한 글만 정해진 날에 올립니다.'],
        en:'Connect your Threads profile. LocalFeed requests threads_basic and threads_content_publish, and only publishes posts you approved on the LocalFeed review page.'}
  }[ch];
  document.getElementById('h').textContent=T.h;
  document.title=T.h+' · 로컬피드 LocalFeed';
  document.getElementById('perm').innerHTML=T.perm.map(function(x){return '<li>'+x+'</li>';}).join('');
  document.getElementById('en').textContent=T.en;
  var go=document.getElementById('go'), msg=document.getElementById('msg');
  go.textContent=T.btn; go.className='big '+T.cls;
  if(!store){msg.className='err';msg.textContent='매장 정보가 없는 링크입니다.';go.disabled=true;return;}
  go.onclick=function(){
    msg.textContent='이동합니다…';
    lfApi({action:'meta_authurl',store:store,ch:ch}).then(function(r){
      if(!r.ok) throw new Error(r.error);
      location.href=r.url;
    }).catch(function(e){msg.className='err';msg.textContent='연결을 시작하지 못했습니다: '+e.message;});
  };
})();
</script>
</body>
</html>
