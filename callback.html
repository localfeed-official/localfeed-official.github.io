<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>연결 완료 · 로컬피드 LocalFeed</title>
<link rel="stylesheet" href="style.css">
<style>
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;background:#f4efe0;border-radius:10px;padding:12px;margin:10px 0}
button{background:var(--navy);color:var(--yellow);border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;cursor:pointer}
.err{color:#b3261e}
</style>
</head>
<body>
<header>
  <div class="wrap"><nav><a class="logo" href="index.html">Local<b>Feed</b></a></nav></div>
</header>
<main class="wrap">
  <div id="ok" hidden>
    <h1>연결 허락을 받았습니다</h1>
    <p>틱톡 연결 허락이 완료되었습니다. 아래 코드를 로컬피드 담당자에게 보내주세요. 이 코드는 몇 분 뒤 만료되며, 비밀번호가 아닙니다.</p>
    <div class="box">
      <div class="code" id="code"></div>
      <button id="copy">코드 복사</button> <span id="copied"></span>
    </div>
    <p class="en">TikTok authorization received. Please send the code above to LocalFeed. It expires in a few minutes and is not a password.</p>
  </div>
  <div id="fail" hidden>
    <h1 class="err">연결이 완료되지 않았습니다</h1>
    <p id="why"></p>
    <p>다시 시도하시거나 <a href="mailto:localfeed.official@gmail.com">localfeed.official@gmail.com</a>으로 알려주세요.</p>
  </div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var code=q.get('code'), err=q.get('error');
  if(code){
    document.getElementById('ok').hidden=false;
    var state=q.get('state');
    var text=code+(state?'\nstate='+state:'');
    document.getElementById('code').textContent=text;
    document.getElementById('copy').onclick=function(){
      navigator.clipboard.writeText(text).then(function(){document.getElementById('copied').textContent='복사됨';});
    };
  }else{
    document.getElementById('fail').hidden=false;
    document.getElementById('why').textContent=err?('사유: '+(q.get('error_description')||err)):'연결 정보가 없습니다.';
  }
})();
</script>
</body>
</html>
