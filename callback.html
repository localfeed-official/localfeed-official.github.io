<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>틱톡 연결 · 로컬피드 LocalFeed</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="style.css">
<style>
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:20px;display:flex;gap:16px;align-items:center}
.box img{width:64px;height:64px;border-radius:50%}
.err{color:#b3261e}
</style>
</head>
<body>
<header>
  <div class="wrap"><nav><a class="logo" href="index.html">Local<b>Feed</b></a></nav></div>
</header>
<main class="wrap">
  <h1 id="title">연결하는 중입니다…</h1>
  <div id="ok" hidden>
    <div class="box"><img id="avatar" alt=""><div><b id="name"></b><br><span id="store"></span></div></div>
    <p>틱톡 연결이 끝났습니다. 앞으로 확인 페이지에서 <b>좋아요</b>를 누르신 영상이 틱톡 초안함으로 들어갑니다. 틱톡 앱 알림을 눌러 게시해 주세요.</p>
    <p class="en">Your TikTok account is connected. Videos you approve on the LocalFeed review page will be sent to your TikTok inbox as drafts.</p>
  </div>
  <p id="err" class="err" hidden></p>
</main>
<script src="config.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var code=q.get('code'), state=q.get('state'), e=q.get('error');
  var title=document.getElementById('title'), err=document.getElementById('err');
  function fail(t){title.textContent='연결이 완료되지 않았습니다';err.hidden=false;err.textContent=t;}
  if(!code){fail(e?('사유: '+(q.get('error_description')||e)):'연결 정보가 없습니다.');return;}
  history.replaceState(null,'',location.pathname);
  lfApi({action:'exchange',code:code,state:state}).then(function(r){
    if(!r.ok) throw new Error(r.error);
    title.textContent='틱톡이 연결되었습니다';
    document.getElementById('ok').hidden=false;
    document.getElementById('name').textContent=r.display_name||'';
    document.getElementById('store').textContent=r.store||'';
    if(r.avatar) document.getElementById('avatar').src=r.avatar; else document.getElementById('avatar').remove();
  }).catch(function(x){fail(x.message);});
})();
</script>
</body>
</html>
