<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>로컬피드 운영</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="a.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="icons/logo.svg" alt=""><div><b>로컬피드</b><span>운영 화면 · 하이브릭</span></div></div>
    <nav id="nav"></nav>
    <button class="btn sm gray" id="reload" style="margin-top:auto">새로고침</button>
  </aside>
  <main class="main">
    <p class="msg" id="msg"></p>
    <div id="view"><h1>불러오는 중…</h1></div>
  </main>
</div>
<script src="config.js"></script>
<script>
(function(){
  var K=null;
  try{K=localStorage.getItem('lf_admin_s'); localStorage.removeItem('lf_admin');}catch(e){}
  if(location.search) history.replaceState(null,'',location.pathname);
  var $=function(id){return document.getElementById(id)}, D=null, tab='dash', cur=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(t){$('msg').textContent=t||'';}
  function copy(t,btn){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){var o=btn.textContent;btn.textContent='복사됨';setTimeout(function(){btn.textContent=o},1200);}).catch(function(){window.prompt('길게 눌러 복사하세요',t);}); }
  function call(body,btn){ say(''); if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='처리 중…';} body.k=K;
    return lfApi(body).then(function(r){ if(!r.ok) throw new Error(r.error); D=r; render(); }).catch(function(e){ if(/^LOGIN/.test(e.message)){ logout(true); return; } say(e.message); if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;} }); }
  function logout(silent){ var k=K; K=null; D=null; try{localStorage.removeItem('lf_admin_s');}catch(e){} if(k&&!silent) _api({action:'admin_logout',k:k}); login(silent?'로그인이 풀렸어요. 다시 로그인해 주세요.':''); }
  function login(m){
    document.querySelector('.side').hidden=true;
    $('view').innerHTML='<div class="card" style="max-width:380px;margin:8vh auto 0"><div class="brand" style="padding:0 0 14px"><img src="icons/logo.svg" alt=""><b>로컬피드</b><span>운영 화면</span></div><form id="lf"><label class="fld"><span>아이디</span><input class="in" id="aid" autocomplete="username" autocapitalize="off"></label><label class="fld"><span>비밀번호</span><input class="in" id="apw" type="password" autocomplete="current-password"></label><button class="btn" id="ago">로그인</button></form><small style="display:block;margin-top:12px;color:var(--s)">처음이면 시트 메뉴 로컬피드 → "9. 운영 화면 로그인 정하기"에서 아이디와 비밀번호를 먼저 정해 주세요.</small></div>';
    say(m||'');
    $('lf').onsubmit=function(ev){ ev.preventDefault(); var b=$('ago'); b.disabled=true; b.textContent='확인 중…'; say('');
      _api({action:'admin_login',id:$('aid').value.trim(),pw:$('apw').value}).then(function(r){ if(!r.ok) throw new Error(r.error); K=r.k; try{localStorage.setItem('lf_admin_s',K);}catch(e){} document.querySelector('.side').hidden=false; $('view').innerHTML='<h1>불러오는 중…</h1>'; return call({action:'admin_state'}); })
      .catch(function(e){ say(e.message); b.disabled=false; b.textContent='로그인'; }); };
  }
  function ico(p){return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var NAV=[['dash','대시보드','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['stores','매장','<path d="M4 10v10h16V10M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/>'],['refs','레퍼런스 조사','<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'],['contents','기획 · 콘텐츠','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['pubs','발행 기록','<path d="M4 12l16-8-6 16-3-6z"/>'],['set','연결 · 설정','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']];
  var KEYS=['place','intro','photos','voice','blog','daangn','igbiz','ig','th','tt'];
  var KNAME={place:'매장 정보',intro:'가게 소개',photos:'사진·얼굴',voice:'목소리',blog:'블로그 주소',daangn:'당근',igbiz:'인스타 비즈니스 전환',ig:'인스타 연결',th:'스레드 연결',tt:'틱톡 연결'};
  function ok(v){return v==='done'||v==='later'||v==='skip';}
  function nDone(s){return KEYS.filter(function(k){return ok(s.steps[k])}).length;}
  function chip(state,doneText){ return state==='done'?'<span class="chip ok">'+esc(doneText||'완료')+'</span>':state==='sent'?'<span class="chip warn">수락 필요</span>':state==='later'?'<span class="chip warn">나중에</span>':state==='skip'?'<span class="chip">안 씀</span>':'<span class="chip">대기</span>'; }
  function logo(f){return '<div class="tile logo"><img src="icons/'+f+'" alt=""></div>';}
  function md(x){var p=String(x||'').split('-');return p.length===3?(+p[1])+'-'+(+p[2]):'';}
  function plan(s){
    var p=s.plan||{status:'시작 전'}, b=function(what,t,cls){return ' <button class="btn sm '+(cls||'gray')+'" style="padding:6px 9px;font-size:12px;display:inline-flex" data-done="'+what+'" data-store="'+esc(s.code)+'">'+t+'</button>';};
    if(p.status==='시작 전') return '<span class="chip">시작 전</span>'+b('trial_start','체험 시작','sec');
    if(p.status==='무료 체험') return '<span class="chip '+(p.over?'bad':p.left<=3?'warn':'soft')+'">무료 '+(p.over?'끝남':'D-'+p.left)+'</span> <small style="display:inline">'+md(p.trialEnd)+'까지</small>'+b('paid','입금 확인');
    if(p.status==='유료') return '<span class="chip '+(p.over?'bad':'ok')+'">유료'+(p.fee?' '+esc(p.fee):'')+'</span> <small style="display:inline">다음 결제 '+md(p.nextPay)+'</small>'+b('paid','입금 확인')+b('stop','중지');
    return '<span class="chip bad">중지</span>'+b('paid','입금 확인');
  }
  function payMsg(t){ return '[로컬피드] '+t.name+' 대표님, '+(t.kind==='trial'?'무료 체험이 ':'이번 달 이용 기간이 ')+md(t.end).replace('-','월 ')+'일에 끝납니다. 계속 이용하시려면'+(t.fee?' 월 '+t.fee+'을':'')+' 입금 후 알려 주세요. 감사합니다.'; }
  function research(s){
    if(s.refRunning) return '<span class="chip soft">조사 중</span>';
    if(s.research) return '<span class="chip '+(s.refs?'ok':'warn')+'">'+(s.refs?'레퍼런스 '+s.refs+'건':'결과 대기')+'</span>';
    return s.steps.intro==='done'?'<span class="chip warn">조사 시작 전</span>':'<span class="chip">가게 소개 대기</span>';
  }
  function stage(s){ // 지금 어느 단계인지 한 단어로
    var n=nDone(s); if(n<KEYS.length) return ['시작하기 '+n+'/'+KEYS.length,'soft'];
    if(!s.research) return ['조사 시작 전','warn']; if(s.refRunning) return ['조사 중','soft'];
    var c=D.contents.filter(function(x){return x.store===s.code}).length; if(!c) return ['기획 만들 차례','warn'];
    return ['콘텐츠 '+c+'개','ok'];
  }
  function todoHtml(){
    return D.todos.length?D.todos.map(function(t){
      var open=' <button class="btn sm gray" data-open="'+esc(t.store)+'">매장 보기</button>';
      if(t.kind==='tester') return '<div class="alert">'+logo('instagram.png')+'<div class="g"><b>'+esc(t.name)+' · 인스타 비즈니스 전환 완료 → 테스터 등록</b><small>아이디 '+esc(t.igId)+' · '+esc(t.at)+'에 대표님이 눌렀어요 · Instagram 테스터와 Threads 테스터 둘 다 추가</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(t.igId)+'">아이디 복사</button><a class="btn sm gray" target="_blank" rel="noopener" href="'+esc(D.roles)+'">Meta 역할 페이지 열기</a><button class="btn sm" data-done="tester" data-store="'+esc(t.store)+'">등록했어요</button></div></div>';
      if(t.kind==='new') return '<div class="alert"><div class="tile" style="background:var(--soft);color:var(--b);font-weight:700;font-size:12px">신규</div><div class="g"><b>'+esc(t.name)+' · 가입 신청이 들어왔어요</b><small>'+esc([t.keys,t.phone,t.at].filter(Boolean).join(' · '))+' · 받기로 하면 "체험 시작"을 누르세요</small></div><div class="acts">'+open+'<button class="btn sm" data-done="trial_start" data-store="'+esc(t.store)+'">체험 시작</button></div></div>';
      if(t.kind==='planfix') return '<div class="alert"><div class="tile" style="background:var(--warnbg);color:var(--warn);font-weight:700;font-size:12px">수정</div><div class="g"><b>'+esc(t.name)+' · 기획을 고쳐 달라고 했어요</b><small>'+esc(t.topic)+' → '+esc(t.note)+'</small></div><div class="acts">'+open+'<button class="btn sm gray" data-tab="contents">기획 보기</button></div></div>';
      if(t.kind==='research') return '<div class="alert"><div class="tile" style="background:var(--soft);color:var(--b)">'+ico('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>')+'</div><div class="g"><b>'+esc(t.name)+' · 가게 소개 도착 → 레퍼런스 조사</b><small>'+esc(t.keys)+'</small></div><div class="acts">'+open+'<button class="btn sm" data-done="research" data-store="'+esc(t.store)+'">조사 시작</button></div></div>';
      if(t.kind==='trial'||t.kind==='pay') return '<div class="alert"><div class="tile" style="background:var(--warnbg);color:var(--warn);font-weight:700;font-size:13px">'+(t.left<0?'지남':'D-'+t.left)+'</div><div class="g"><b>'+esc(t.name)+' · '+(t.kind==='trial'?'무료 체험':'이번 달 이용')+'이 '+md(t.end).replace('-','월 ')+'일에 '+(t.left<0?'끝났어요':'끝나요')+'</b><small>'+(t.kind==='trial'?'유료 전환 안내를 보내고, 입금되면 "입금 확인"을 누르세요':'입금되면 "입금 확인"을 누르세요. 다음 결제일이 한 달 뒤로 넘어갑니다')+'</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(payMsg(t))+'">안내 문구 복사</button><button class="btn sm" data-done="paid" data-store="'+esc(t.store)+'">입금 확인</button></div></div>';
      return '<div class="alert">'+logo('daangn.png')+'<div class="g"><b>'+esc(t.name)+' · 당근 초대 도착 · 코드 <span style="font-size:18px;letter-spacing:2px;color:var(--b)">'+esc(t.code||'없음')+'</span></b><small>초대 링크를 열고 코드 6자리를 넣어 "운영자 수락"을 누르세요. 수락하면 링크와 코드는 지워집니다.</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(t.code)+'">코드 복사</button><a class="btn sm gray" target="_blank" rel="noopener noreferrer" href="'+esc(t.link)+'">초대 링크 열기</a><button class="btn sm" data-done="daangn" data-store="'+esc(t.store)+'">수락했어요</button></div></div>';
    }).join(''):'<p class="empty">지금 할 일이 없습니다.</p>';
  }
  function stat(l,v,s2){return '<div class="stat"><small>'+l+'</small><b>'+v+'</b><span>'+s2+'</span></div>';}
  var V={};
  V.dash=function(){
    var d=new Date(), S=D.stores, trial=S.filter(function(s){return s.plan.status==='무료 체험'}).length, paid=S.filter(function(s){return s.plan.status==='유료'}).length;
    var okP=D.publishes.filter(function(p){return p.status==='게시됨'}).length, bad=D.publishes.filter(function(p){return p.status==='실패'}).length;
    var cols=[['시작하기',function(s){return nDone(s)<KEYS.length}],['조사',function(s){return nDone(s)===KEYS.length&&(!s.research||s.refRunning)}],['기획·제작',function(s){return nDone(s)===KEYS.length&&s.research&&!s.refRunning&&!D.contents.some(function(c){return c.store===s.code})}],['운영 중',function(s){return nDone(s)===KEYS.length&&D.contents.some(function(c){return c.store===s.code})}]];
    return '<div class="hd"><div><small>'+(d.getMonth()+1)+'월 '+d.getDate()+'일</small><h1>오늘 할 일 '+D.todos.length+'건</h1></div></div>'+
      '<div class="stats">'+stat('운영 매장',S.length,'무료 체험 '+trial+' · 유료 '+paid)+stat('지금 할 일',D.todos.length,'아래에서 바로 처리')+stat('콘텐츠',D.contents.length,'기획·제작된 것')+stat('최근 발행',okP,'실패 '+bad+'건')+'</div>'+
      '<div class="box"><h2>지금 손대야 할 것</h2>'+todoHtml()+'</div>'+
      '<div class="box"><h2>매장이 어디까지 왔나</h2><div class="pipe">'+cols.map(function(c){var l=S.filter(c[1]);return '<div><div class="ph2">'+c[0]+' <b>'+l.length+'</b></div>'+(l.map(function(s){var st=stage(s);return '<button class="pcard" data-open="'+esc(s.code)+'"><b>'+esc(s.name)+'</b><span class="chip '+st[1]+'">'+st[0]+'</span></button>';}).join('')||'<p class="empty">없음</p>')+'</div>';}).join('')+'</div></div>';
  };
  V.stores=function(){
    return '<div class="hd"><h1>매장</h1></div><div class="box"><h2>매장 추가</h2><div class="form"><input class="in" id="nName" placeholder="매장 이름 (예: 결 헤어)"><input class="in" id="nDong" placeholder="동네"><input class="in" id="nInd" placeholder="업종"><button class="btn sm" id="add" style="padding:14px 18px">매장 추가</button></div></div>'+
      '<div class="box"><h2>매장 '+D.stores.length+'곳</h2><table class="tbl"><thead><tr><th>매장</th><th>시작하기</th><th>조사</th><th>인스타</th><th>스레드</th><th>당근</th><th>틱톡</th><th>이용 기간</th><th></th></tr></thead><tbody>'+
      D.stores.map(function(s){var st=s.steps,n=nDone(s);
        return '<tr><td><button class="link" data-open="'+esc(s.code)+'"><b>'+esc(s.name)+'</b></button><small>'+esc([s.dong,s.industry].filter(Boolean).join(' · '))+'</small></td>'+
        '<td><span class="chip '+(n===KEYS.length?'ok':'soft')+'">'+n+' / '+KEYS.length+'</span></td><td>'+research(s)+'</td>'+
        '<td>'+(st.ig==='done'?chip('done',s.igName):st.igbiz==='done'&&st.tester!=='done'?'<span class="chip warn">테스터 등록</span>':chip('todo'))+'</td>'+
        '<td>'+chip(st.th,s.thName)+'</td><td>'+chip(st.daangn,/안 함/.test(s.daangn)?'안 함':'수락')+'</td><td>'+chip(st.tt,s.ttName)+'</td><td>'+plan(s)+'</td>'+
        '<td style="text-align:right;white-space:nowrap"><button class="btn sm sec" style="display:inline-flex" data-copy="'+esc(s.link)+'">링크 복사</button></td></tr>';}).join('')+'</tbody></table></div>';
  };
  V.store=function(){
    var s=D.stores.filter(function(x){return x.code===cur})[0]; if(!s){tab='stores';return V.stores();}
    var st=s.steps,I=s.intro||{},f=s.files||{},T=s.times||{};
    var note={place:s.online?'온라인 매장':'',intro:[I.dong,I.industry].filter(Boolean).join(' · '),photos:'매장 '+f.store+'장 · 얼굴 '+f.face+'장'+(T.photos?' · 동의 '+T.photos:''),voice:st.voice==='skip'?'자막만':'녹음 '+f.voice+'개'+(T.voice?' · 동의 '+T.voice:''),blog:s.blogUrl,daangn:s.daangn,igbiz:T.igbiz?'전환 '+T.igbiz+(T.tester?' · 테스터 등록 '+T.tester:' · 테스터 등록 필요'):'',ig:s.igName,th:s.thName,tt:s.ttName};
    var cs=D.contents.filter(function(c){return c.store===s.code}), ps=D.publishes.filter(function(p){return p.store===s.code});
    function kv(k,v){return v?'<div class="kv"><span>'+k+'</span><p>'+esc(v)+'</p></div>':'';}
    return '<div class="hd"><div><button class="link" data-tab="stores">← 매장 목록</button><h1>'+esc(s.name)+'</h1><small>'+esc([s.dong,s.industry,s.code,s.phone,s.joined?'가입 '+s.joined:'',s.noPin?'로그인 아직 안 정함':''].filter(Boolean).join(' · '))+'</small></div><div class="acts"><button class="btn sm gray" data-done="resetpin" data-store="'+esc(s.code)+'">비밀번호 다시 정하기</button><button class="btn sm gray" style="color:var(--bad)" data-done="remove" data-store="'+esc(s.code)+'" data-name="'+esc(s.name)+'">삭제</button></div></div>'+
      '<div class="two"><div><div class="box"><h2>시작하기 '+nDone(s)+' / '+KEYS.length+'</h2>'+KEYS.map(function(k,i){return '<div class="line"><span class="num '+(ok(st[k])?'on':'')+'">'+(i+1)+'</span><div class="g"><b>'+KNAME[k]+'</b><small>'+esc(note[k]||'')+'</small></div>'+(k==='ig'&&st.igbiz==='done'&&st.tester!=='done'?'<span class="chip warn">테스터 등록</span>':chip(st[k],k==='ig'||k==='th'||k==='tt'?'연결':'완료'))+'</div>';}).join('')+'</div></div>'+
      '<div><div class="box"><h2>이용 기간</h2><div style="padding-bottom:14px;line-height:2.2">'+plan(s)+'</div></div>'+
      '<div class="box"><h2>가게 소개</h2><div style="padding-bottom:10px">'+(I.menu?kv('업종·동네',[I.industry,I.dong].join(' · '))+kv('대표 메뉴',I.menu)+kv('주 손님',I.customer)+kv('자랑',I.strong)+kv('닮고 싶은 곳',I.like)+kv('매장 주소',s.place):'<p class="empty">아직 적지 않았습니다.</p>')+'</div></div>'+
      '<div class="box"><h2>레퍼런스 조사</h2><div style="padding-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+research(s)+'<small style="color:var(--s)">'+esc(s.research||'')+'</small>'+(st.intro==='done'&&!s.refRunning?'<button class="btn sm '+(s.research?'gray':'')+'" data-done="research" data-store="'+esc(s.code)+'">'+(s.research?'다시 조사':'조사 시작')+'</button>':'')+'</div></div></div></div>'+
      pgroups(D.plans.filter(function(p){return p.store===s.code}),false)+'<div class="box"><h2>콘텐츠 '+cs.length+'개</h2>'+(cs.length?ctable(cs,false):'<p class="empty">아직 없습니다. 조사가 끝나면 첫 주 기획을 만듭니다.</p>')+'</div>'+
      '<div class="box"><h2>발행 기록 '+ps.length+'건</h2>'+(ps.length?ptable(ps,false):'<p class="empty">아직 올린 글이 없습니다.</p>')+'</div>';
  };
  function pchip(p){ var s=/^(확인|보냄)/.test(p.admin); return (s?'<span class="chip soft">매장에 보냄</span>':'<span class="chip">아직 안 보냄</span>')+' '+(/^좋아요/.test(p.owner)?'<span class="chip ok">매장 좋아요</span>':/^수정/.test(p.owner)?'<span class="chip bad">수정 요청</span>':s?'<span class="chip warn">매장 확인 기다림</span>':''); }
  function pitem(p){ var s=/^(확인|보냄)/.test(p.admin);
    return '<details class="pl"><summary><span class="pf">'+esc(p.form)+'</span><b>'+esc(p.topic)+'</b><span class="ps">'+pchip(p)+'</span></summary><ol>'+p.pages.split(' / ').map(function(x){return '<li>'+esc(x.replace(/^\d+\s*/,''))+'</li>';}).join('')+'</ol>'+
      (p.note?'<div class="caution" style="margin:8px 0"><b>매장 대표님 한 줄</b> '+esc(p.note)+'</div>':'')+
      (p.basis?'<small><b>참고한 구조</b> '+esc(p.basis)+'</small>':'')+(p.urls?'<small><b>근거</b> '+p.urls.split(/\s*,\s*/).map(function(u,i){return /^https:\/\//.test(u)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">글 '+(i+1)+'</a>':'';}).join(' · ')+'</small>':'')+(p.memo?'<small><b>메모</b> '+esc(p.memo)+'</small>':'')+
      '<div class="acts" style="margin-top:10px">'+(/^수정/.test(p.owner)?'<button class="btn sm" data-plan="send" data-row="'+p.row+'">고쳤어요 · 다시 보내기</button>':s?'<button class="btn sm gray" data-plan="hold" data-row="'+p.row+'">보낸 것 거두기</button>':'<button class="btn sm sec" data-plan="send" data-row="'+p.row+'">이것만 보내기</button>')+'</div></details>'; }
  function pgroups(list,withStore){ if(!list.length) return '<div class="box"><h2>기획</h2><p class="empty">아직 기획이 없습니다. 조사가 끝난 매장이 있으면 Claude에게 "○○ 매장 기획 잡아 줘"라고 말해 주세요.</p></div>';
    var g={},order=[]; list.forEach(function(p){var k=p.store+'|'+p.week; if(!g[k]){g[k]=[];order.push(k);} g[k].push(p);});
    return order.reverse().map(function(k){ var L=g[k], p0=L[0], st=D.stores.filter(function(x){return x.code===p0.store})[0], un=L.filter(function(p){return !/^(확인|보냄)/.test(p.admin)}).length, okn=L.filter(function(p){return /^좋아요/.test(p.owner)}).length;
      return '<div class="box"><div class="hd" style="margin:0 0 6px"><div><h2 style="margin:0">'+(withStore?esc(st?st.name:p0.store)+' · ':'')+esc(md(p0.week).replace('-','월 '))+'일 주</h2><small>'+L.length+'건 · 매장 좋아요 '+okn+'건'+(st?'':' · 삭제된 매장')+'</small></div><div class="acts">'+(withStore&&st?'<button class="btn sm gray" data-open="'+esc(p0.store)+'">매장 보기</button>':'')+(un&&st?'<button class="btn sm" data-planweek="'+esc(p0.week)+'" data-store="'+esc(p0.store)+'">'+un+'건 매장에 보내기</button>':'')+'</div></div>'+L.map(pitem).join('')+'</div>'; }).join(''); }
  function ctable(list,withStore){return '<table class="tbl"><thead><tr><th>예정일</th>'+(withStore?'<th>매장</th>':'')+'<th>제목</th><th>형식</th><th>상태</th></tr></thead><tbody>'+list.map(function(c){return '<tr><td>'+esc(md(c.date))+'</td>'+(withStore?'<td>'+esc(c.name)+'</td>':'')+'<td><b style="font-size:14px">'+esc(c.title)+'</b>'+(c.check?'<small>'+esc(c.check)+'</small>':'')+'</td><td>'+esc(c.form)+'</td><td><span class="chip '+(/게시|완료/.test(c.status)?'ok':/확인/.test(c.status)?'warn':'')+'">'+esc(c.status||'-')+'</span></td></tr>';}).join('')+'</tbody></table>';}
  function ptable(list,withStore){return '<table class="tbl"><thead><tr><th>시각</th>'+(withStore?'<th>매장</th>':'')+'<th>채널</th><th>상태</th><th>내용</th></tr></thead><tbody>'+list.map(function(p){return '<tr><td style="white-space:nowrap">'+esc(p.at)+'</td>'+(withStore?'<td>'+esc(p.name)+'</td>':'')+'<td>'+esc(p.ch)+'</td><td><span class="chip '+(p.status==='게시됨'?'ok':'bad')+'">'+esc(p.status)+'</span></td><td>'+(p.link?'<a href="'+esc(p.link)+'" target="_blank" rel="noopener">게시물 열기</a>':'<small>'+esc(p.memo)+'</small>')+'</td></tr>';}).join('')+'</tbody></table>';}
  V.refs=function(){return '<div class="hd"><h1>레퍼런스 조사</h1></div><div class="box"><h2>업종별 조사 현황</h2>'+(D.industries.length?'<table class="tbl"><thead><tr><th>업종</th><th>모은 글</th><th>마지막 조사</th><th>해시태그</th><th>블로그 키워드</th></tr></thead><tbody>'+D.industries.map(function(i){return '<tr><td><b>'+esc(i.name)+'</b></td><td>'+(i.running?'<span class="chip soft">조사 중</span>':'<span class="chip '+(i.count?'ok':'')+'">'+i.count+'건</span>')+'</td><td>'+esc(md(i.last)||'-')+'</td><td><small>'+esc(i.ig)+'</small></td><td><small>'+esc(i.blog)+'</small></td></tr>';}).join('')+'</tbody></table>':'<p class="empty">업종이 없습니다.</p>')+'<p class="empty">조사는 매장 상세나 대시보드 알림의 "조사 시작"으로 겁니다. 인스타·틱톡은 10분쯤 뒤에 들어옵니다. 해시태그와 키워드는 시트의 업종 탭에서 고칩니다. <a href="'+esc(D.sheet)+'" target="_blank" rel="noopener">시트 열기</a></p></div>';};
  V.contents=function(){return '<div class="hd"><div><h1>기획 · 콘텐츠</h1><small>기획은 매장별·주별로 묶여 있어요. 먼저 읽어 보고 "매장에 보내기"를 누르면 매장 대표님 화면에 뜹니다.</small></div></div>'+pgroups(D.plans,true)+'<div class="box"><h2>최근 '+D.contents.length+'개</h2>'+(D.contents.length?ctable(D.contents.slice().reverse(),true):'<p class="empty">아직 없습니다.</p>')+'</div>';};
  V.pubs=function(){return '<div class="hd"><h1>발행 기록</h1></div><div class="box"><h2>최근 '+D.publishes.length+'건</h2>'+(D.publishes.length?ptable(D.publishes,true):'<p class="empty">아직 없습니다.</p>')+'</div>';};
  V.set=function(){function row(t,d,href){return '<div class="line"><div class="g"><b>'+t+'</b><small>'+d+'</small></div><a class="btn sm gray" target="_blank" rel="noopener" href="'+esc(href)+'">열기</a></div>';}
    return '<div class="hd"><h1>연결 · 설정</h1></div><div class="box"><h2>바로 가기</h2>'+row('구글 시트 (로컬피드_발행)','매장·업종·레퍼런스·기획·콘텐츠·발행 원본',D.sheet)+row('Meta 앱 역할','인스타·스레드 테스터 등록',D.roles)+row('당근비즈니스','초대 수락, 소식 올리기','https://bizprofile.daangn.com/')+row('매장 대표님 화면 미리보기','로컬피드 안내 페이지','index.html')+'</div>'+
      '<div class="box"><h2>채널별 올리는 방식</h2><div class="line"><div class="g"><b>인스타 · 스레드</b><small>연결된 계정에 자동 게시. 심사 전이라 매장마다 테스터 등록 필요</small></div><span class="chip ok">사용 중</span></div><div class="line"><div class="g"><b>당근</b><small>운영자 초대를 수락한 뒤, 대표님 PC 크롬에서 올림</small></div><span class="chip ok">사용 중</span></div><div class="line"><div class="g"><b>틱톡</b><small>초안함으로 전송. 정식 심사 결과 대기</small></div><span class="chip warn">심사 중</span></div><div class="line"><div class="g"><b>네이버 블로그</b><small>글과 사진을 묶어 드리면 매장 대표님이 붙여넣고 예약</small></div><span class="chip ok">사용 중</span></div></div>';};
  function render(){
    $('nav').innerHTML=NAV.map(function(n){var on=tab===n[0]||(tab==='store'&&n[0]==='stores');return '<button data-tab="'+n[0]+'" class="'+(on?'on':'')+'">'+ico(n[2])+n[1]+(n[0]==='dash'&&D.todos.length?'<i>'+D.todos.length+'</i>':'')+'</button>';}).join('');
    $('view').innerHTML=V[tab]();
    [].forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){tab=b.dataset.tab;say('');render();window.scrollTo(0,0);};});
    [].forEach.call(document.querySelectorAll('[data-open]'),function(b){b.onclick=function(){cur=b.dataset.open;tab='store';say('');render();window.scrollTo(0,0);};});
    [].forEach.call(document.querySelectorAll('[data-copy]'),function(b){b.onclick=function(){copy(b.dataset.copy,b);};});
    [].forEach.call(document.querySelectorAll('[data-done]'),function(b){b.onclick=function(){
      var v='', w=b.dataset.done;
      if(w==='daangn'){ v=window.prompt('당근비즈니스에서 이 매장의 프로필 번호(주소의 biz_accounts 뒤 숫자)를 적어 주세요. 모르면 비워 두세요.','')||''; }
      if(w==='paid'){ v=window.prompt('입금을 확인했나요? 월 요금을 적으면 기록됩니다(예: 99,000원). 그대로 두려면 비워 두고 확인.',''); if(v===null) return; }
      if(w==='trial_start'&&!window.confirm('오늘부터 무료 체험 21일을 시작할까요?')) return;
      if(w==='research'&&!window.confirm('이 매장 업종으로 레퍼런스 조사를 시작할까요?\n인스타·틱톡·블로그에서 반응 좋은 글을 모읍니다. 10분쯤 걸리고 수집 비용이 조금 듭니다.')) return;
      if(w==='remove'){ var typed=window.prompt('"'+b.dataset.name+'" 매장을 삭제합니다.\n· 이 매장의 전용 링크가 열리지 않게 됩니다\n· 저장된 인스타·스레드·틱톡 연결이 지워져 더 이상 올릴 수 없습니다\n· 시트의 줄은 "삭제" 표시로 남습니다\n\n삭제하려면 매장 이름을 그대로 적어 주세요.',''); if(typed===null) return; if(typed.trim()!==b.dataset.name){ say('매장 이름이 달라 삭제하지 않았습니다.'); return; } tab='stores'; }
      if(w==='resetpin'){ v=window.prompt('대표님께 알려 드릴 새 비밀번호를 숫자 4~6자리로 적어 주세요.\n들어온 뒤 대표님이 직접 바꿀 수는 없으니, 전화로 확인하고 정해 주세요.',''); if(!v) return; }
      if(w==='stop'&&!window.confirm('이 매장의 이용을 중지로 바꿀까요?')) return;
      call({action:'admin_done',store:b.dataset.store,what:w,value:v},b);
    };});
    [].forEach.call(document.querySelectorAll('[data-plan]'),function(b){b.onclick=function(){ if(b.dataset.plan==='hold'&&!window.confirm('매장 화면에서 이 기획을 내릴까요?')) return; call({action:'admin_plan',row:b.dataset.row,what:b.dataset.plan},b); };});
    [].forEach.call(document.querySelectorAll('[data-planweek]'),function(b){b.onclick=function(){ if(window.confirm('이 주 기획을 매장 대표님 화면에 보낼까요?')) call({action:'admin_plan_week',store:b.dataset.store,week:b.dataset.planweek},b); };});
    var add=$('add'); if(add) add.onclick=function(){ call({action:'admin_add',name:$('nName').value,dong:$('nDong').value,industry:$('nInd').value},add); };
  }
  function norm(r){ r.industries=r.industries||[]; r.plans=r.plans||[]; r.contents=r.contents||[]; r.publishes=r.publishes||[]; r.sheet=r.sheet||'#'; r.stores.forEach(function(s){s.plan=s.plan||{status:'시작 전'};s.files=s.files||{store:0,face:0,voice:0};s.steps.intro=s.steps.intro||'todo';s.steps.voice=s.steps.voice||'todo';}); return r; }
  var _api=window.lfApi; window.lfApi=function(b){return _api(b).then(function(r){return r&&r.ok&&r.stores?norm(r):r;});};
  var lo=document.createElement('button'); lo.className='btn sm gray'; lo.textContent='로그아웃'; lo.style.marginTop='8px'; lo.onclick=function(){logout(false);}; document.querySelector('.side').appendChild(lo);
  $('reload').onclick=function(){call({action:'admin_state'},$('reload'));};
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&D) call({action:'admin_state'}); });
  if(!K){ login(''); return; }
  call({action:'admin_state'}).then(function(){ if(!D&&K) $('view').innerHTML='<h1>열 수 없습니다</h1>'; });
})();
</script>
