<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>로컬피드 운영</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="a.css">
</head>
<body>
<div class="wide">
  <div class="brand"><img src="icons/logo.svg" alt=""><b>로컬피드</b><span>운영 화면 · 하이브릭</span></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div><div style="font-size:14px;color:var(--s)" id="date"></div><h1 id="h1">불러오는 중…</h1></div>
    <button class="btn sm gray" id="reload">새로고침</button>
  </div>
  <p class="msg" id="msg"></p>
  <div class="box"><h2>지금 손대야 할 것</h2><div id="todos"></div></div>
  <div class="box"><h2>매장</h2>
    <div class="form"><input class="in" id="nName" placeholder="매장 이름 (예: 결 헤어)"><input class="in" id="nDong" placeholder="동네"><input class="in" id="nInd" placeholder="업종"><button class="btn sm" id="add" style="padding:14px 18px">매장 추가</button></div>
    <table class="tbl"><thead><tr><th>매장</th><th>시작하기</th><th>인스타</th><th>스레드</th><th>당근</th><th>틱톡</th><th>블로그</th><th>이용 기간</th><th></th></tr></thead><tbody id="stores"></tbody></table>
  </div>
</div>
<script src="config.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), K;
  try{K=q.get('k')||localStorage.getItem('lf_admin'); if(q.get('k')){localStorage.setItem('lf_admin',K);history.replaceState(null,'',location.pathname);}}catch(e){K=q.get('k');}
  var $=function(id){return document.getElementById(id)}, D=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(t){$('msg').textContent=t||'';}
  function copy(t,btn){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){var o=btn.textContent;btn.textContent='복사됨';setTimeout(function(){btn.textContent=o},1200);}).catch(function(){window.prompt('길게 눌러 복사하세요',t);}); }
  function call(body,btn){ say(''); if(btn) btn.disabled=true; body.k=K;
    return lfApi(body).then(function(r){ if(!r.ok) throw new Error(r.error); D=r; render(); }).catch(function(e){ say(e.message); if(btn) btn.disabled=false; }); }
  function chip(state,doneText){ return state==='done'?'<span class="chip ok">'+esc(doneText||'연결')+'</span>':state==='sent'?'<span class="chip warn">수락 필요</span>':'<span class="chip">대기</span>'; }
  function md(x){var p=String(x||'').split('-');return p.length===3?(+p[1])+'-'+(+p[2]):'';}
  function plan(s){
    var p=s.plan||{status:'시작 전'}, b=function(what,t,cls){return ' <button class="btn sm '+(cls||'gray')+'" style="padding:6px 9px;font-size:12px" data-done="'+what+'" data-store="'+esc(s.code)+'">'+t+'</button>';};
    if(p.status==='시작 전') return '<span class="chip">시작 전</span>'+b('trial_start','체험 시작','sec');
    if(p.status==='무료 체험') return '<span class="chip '+(p.over?'bad':p.left<=3?'warn':'soft')+'">무료 '+(p.over?'끝남':'D-'+p.left)+'</span><small>'+md(p.trialEnd)+'까지</small>'+b('paid','입금 확인');
    if(p.status==='유료') return '<span class="chip '+(p.over?'bad':'ok')+'">유료'+(p.fee?' '+esc(p.fee):'')+'</span><small>다음 결제 '+md(p.nextPay)+'</small>'+b('paid','입금 확인')+b('stop','중지');
    return '<span class="chip bad">중지</span>'+b('paid','입금 확인');
  }
  function payMsg(t){ return '[로컬피드] '+t.name+' 대표님, '+(t.kind==='trial'?'무료 체험이 ':'이번 달 이용 기간이 ')+md(t.end).replace('-','월 ')+'일에 끝납니다. 계속 이용하시려면'+(t.fee?' 월 '+t.fee+'을':'')+' 입금 후 알려 주세요. 감사합니다.'; }
  function logo(f){return '<div class="tile logo"><img src="icons/'+f+'" alt=""></div>';}
  function render(){
    var d=new Date(); $('date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일';
    $('h1').textContent='오늘 할 일 '+D.todos.length+'건';
    $('todos').innerHTML=D.todos.length?D.todos.map(function(t,i){
      if(t.kind==='tester') return '<div class="alert">'+logo('instagram.png')+'<div class="g"><b>'+esc(t.name)+' · 인스타 비즈니스 전환 완료 → 테스터 등록</b><small>아이디 '+esc(t.igId)+' · '+esc(t.at)+'에 대표님이 눌렀어요 · Instagram 테스터와 Threads 테스터 둘 다 추가</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(t.igId)+'">아이디 복사</button><a class="btn sm gray" target="_blank" rel="noopener" href="'+esc(D.roles)+'">Meta 역할 페이지 열기</a><button class="btn sm" data-done="tester" data-store="'+esc(t.store)+'">등록했어요</button></div></div>';
      if(t.kind==='research') return '<div class="alert"><div class="tile" style="background:var(--soft);color:var(--b)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></div><div class="g"><b>'+esc(t.name)+' · 가게 소개 도착 → 레퍼런스 조사 시작</b><small>'+esc(t.keys)+'</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(t.keys)+'">조사 기준 복사</button><button class="btn sm" data-done="research" data-store="'+esc(t.store)+'">조사 시작했어요</button></div></div>';
      if(t.kind==='trial'||t.kind==='pay') return '<div class="alert"><div class="tile" style="background:var(--warnbg);color:var(--warn);font-weight:700;font-size:13px">'+(t.left<0?'지남':'D-'+t.left)+'</div><div class="g"><b>'+esc(t.name)+' · '+(t.kind==='trial'?'무료 체험':'이번 달 이용')+'이 '+md(t.end).replace('-','월 ')+'일에 '+(t.left<0?'끝났어요':'끝나요')+'</b><small>'+(t.kind==='trial'?'유료 전환 안내를 보내고, 입금되면 "입금 확인"을 누르세요':'입금되면 "입금 확인"을 누르세요. 다음 결제일이 한 달 뒤로 넘어갑니다')+'</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(payMsg(t))+'">안내 문구 복사</button><button class="btn sm" data-done="paid" data-store="'+esc(t.store)+'">입금 확인</button></div></div>';
      return '<div class="alert">'+logo('daangn.png')+'<div class="g"><b>'+esc(t.name)+' · 당근 초대 도착 · 코드 <span style="font-size:18px;letter-spacing:2px;color:var(--b)">'+esc(t.code||'없음')+'</span></b><small>초대 링크를 열고 코드 6자리를 넣어 "운영자 수락"을 누르세요. 수락하면 링크와 코드는 지워집니다.</small></div><div class="acts"><button class="btn sm gray" data-copy="'+esc(t.code)+'">코드 복사</button><a class="btn sm gray" target="_blank" rel="noopener noreferrer" href="'+esc(t.link)+'">초대 링크 열기</a><button class="btn sm" data-done="daangn" data-store="'+esc(t.store)+'">수락했어요</button></div></div>';
    }).join(''):'<p style="color:var(--s);font-size:14px;padding:6px 0 14px">지금 할 일이 없습니다.</p>';
    $('stores').innerHTML=D.stores.map(function(s){
      var st=s.steps, keys=['place','intro','photos','voice','blog','daangn','igbiz','ig','th','tt'], f=s.files||{store:0,face:0,voice:0};
      var n=keys.filter(function(k){return st[k]==='done'||st[k]==='later'||st[k]==='skip'}).length;
      return '<tr><td><b>'+esc(s.name)+'</b><small>'+esc([s.dong,s.industry,s.code].filter(Boolean).join(' · '))+'</small></td>'+
        '<td><span class="chip '+(n===keys.length?'ok':'soft')+'">'+n+' / '+keys.length+'</span><small>사진 '+f.store+' · 얼굴 '+f.face+' · 목소리 '+(st.voice==='skip'?'안 씀':f.voice)+'</small></td>'+
        '<td>'+(st.ig==='done'?chip('done',s.igName):st.igbiz==='done'&&st.tester!=='done'?'<span class="chip warn">테스터 등록</span>':chip('todo'))+'</td>'+
        '<td>'+chip(st.th,s.thName)+'</td><td>'+chip(st.daangn,'수락')+'</td><td>'+chip(st.tt,s.ttName)+'</td><td>'+chip(st.blog,'주소 받음')+'</td>'+
        '<td>'+plan(s)+'</td>'+
        '<td style="text-align:right;white-space:nowrap"><button class="btn sm sec" style="display:inline-flex" data-copy="'+esc(s.link)+'">링크 복사</button> <button class="btn sm gray" style="display:inline-flex;color:var(--bad)" data-done="remove" data-store="'+esc(s.code)+'" data-name="'+esc(s.name)+'">삭제</button></td></tr>';
    }).join('');
    [].forEach.call(document.querySelectorAll('[data-copy]'),function(b){b.onclick=function(){copy(b.dataset.copy,b);};});
    [].forEach.call(document.querySelectorAll('[data-done]'),function(b){b.onclick=function(){
      var v='', w=b.dataset.done;
      if(w==='daangn'){ v=window.prompt('당근비즈니스에서 이 매장의 프로필 번호(주소의 biz_accounts 뒤 숫자)를 적어 주세요. 모르면 비워 두세요.','')||''; }
      if(w==='paid'){ v=window.prompt('입금을 확인했나요? 월 요금을 적으면 기록됩니다(예: 99,000원). 그대로 두려면 비워 두고 확인.',''); if(v===null) return; }
      if(w==='trial_start'&&!window.confirm('오늘부터 무료 체험 21일을 시작할까요?')) return;
      if(w==='remove'){ var typed=window.prompt('"'+b.dataset.name+'" 매장을 삭제합니다.\n· 이 매장의 전용 링크가 열리지 않게 됩니다\n· 저장된 인스타·스레드·틱톡 연결이 지워져 더 이상 올릴 수 없습니다\n· 시트의 줄은 "삭제" 표시로 남습니다\n\n삭제하려면 매장 이름을 그대로 적어 주세요.',''); if(typed===null) return; if(typed.trim()!==b.dataset.name){ say('매장 이름이 달라 삭제하지 않았습니다.'); return; } }
      if(w==='stop'&&!window.confirm('이 매장의 이용을 중지로 바꿀까요?')) return;
      call({action:'admin_done',store:b.dataset.store,what:b.dataset.done,value:v},b);
    };});
  }
  if(!K){$('h1').textContent='운영 화면 주소가 필요합니다';say('시트 메뉴 "9. 운영 화면 주소 만들기"에서 받은 주소로 들어와 주세요.');return;}
  $('reload').onclick=function(){call({action:'admin_state'});};
  $('add').onclick=function(){ call({action:'admin_add',name:$('nName').value,dong:$('nDong').value,industry:$('nInd').value},$('add')).then(function(){$('add').disabled=false;$('nName').value=$('nDong').value=$('nInd').value='';}); };
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&D) call({action:'admin_state'}); });
  call({action:'admin_state'}).then(function(){ if(!D) $('h1').textContent='열 수 없습니다'; });
})();
</script>
</body>
</html>
