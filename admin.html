<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>(새 화면 시안) 로컬피드 운영</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="a.css?v=1128e">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="icons/logo.svg" alt=""><div><b>로컬피드</b><span>운영 화면 · 하이브릭</span></div></div>
    <nav id="nav"></nav>
    <button class="btn sm gray" id="reload" style="margin-top:auto">새로고침</button>
  </aside>
  <main class="main">
    <div id="topbar" hidden><label>보는 범위 <select id="sf"></select></label><span id="tbnote"></span></div>
    <p class="msg" id="msg"></p>
    <div id="jobs" hidden></div>
    <div id="view"><div class="lfload"><img src="icons/logo.svg" alt=""><i></i><i></i><i></i></div></div>
  </main>
</div>
<script src="config.js"></script>
<script src="cards.js?v=1128h"></script>
<script>
(function(){
  var K=null;
  try{K=localStorage.getItem('lf_admin_s'); localStorage.removeItem('lf_admin');}catch(e){}
  if(location.search) history.replaceState(null,'',location.pathname);
  var $=function(id){return document.getElementById(id)}, D=null, tab='dash', cur=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(t,good){var m=$('msg'); m.textContent=t||''; m.className=t?('msg banner'+(good?' good':'')):'msg'; if(t){ try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);} }}
  function copy(t,btn){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){var o=btn.textContent;btn.textContent='복사됨';setTimeout(function(){btn.textContent=o},1200);}).catch(function(){window.prompt('길게 눌러 복사하세요',t);}); }
  function cost(code){ var u=((D.usage||{}).month||{})[code]||0; return '약 '+Math.round(u*1450).toLocaleString()+'원'; }
  var BUSY={make:false,cards:false,bulk:false};
  // 글 만들기: 한 건마다 짧은 글 → 블로그 글 순서로 따로 요청한다. 메뉴를 옮겨도 계속 돈다.
  function makeTexts(rows){ if(BUSY.make) return; BUSY.make=true; var i=0, J=job('글 만들기 시작');
    function stop(msg){ BUSY.make=false; J.end(); render(); if(msg) say(msg); }
    (function next(){ if(i>=rows.length) return stop('');
      J.set('글 만드는 중 '+(i+1)+'/'+rows.length+' · 다른 메뉴를 봐도 계속 돼요');
      _api({action:'admin_make_one',k:K,row:rows[i]}).then(function(r){ if(!r.ok) throw new Error(r.error); D=norm(r); render();
        var need=D.works.filter(function(c){return !c.text['블로그 글'];}).map(function(c){return c.id;});
        return (function blog(n){ if(n>=need.length) return null; J.set('블로그 글 쓰는 중 '+(i+1)+'/'+rows.length);
          return _api({action:'admin_make_blog',k:K,id:need[n]}).then(function(r2){ if(r2.ok){ D=norm(r2); render(); } return blog(n+1); }); })(0);
      }).then(function(){ i++; next(); }).catch(function(e){ stop((i+1)+'번째에서 멈췄어요: '+e.message+' (이미 만든 것은 남아 있어요. 다시 누르면 남은 것부터 만듭니다)'); }); })(); }
  var OPT={}, TTERR='', REPOST='', TTPV={};
  // 틱톡 장면 미리보기: 작은 그림으로 바꿔서 기억해 둔다
  function fillTT(){ [].forEach.call(document.querySelectorAll('[data-ttpv]'),function(el){ if(el.dataset.busy) return; el.dataset.busy='1'; var c=D.works.filter(function(x){return x.id===el.dataset.ttpv})[0]; if(!c) return; var st=D.stores.filter(function(x){return x.code===c.store})[0]||{}, t=c.text['틱톡 제목·설명']||'';
      try{ var U=lfCards.ttFrames(t,{name:st.name||'',color:st.color||''}).map(function(cv){ var s=document.createElement('canvas'); s.height=480; s.width=270; s.getContext('2d').drawImage(cv,0,0,270,480); return s.toDataURL('image/jpeg',0.82); }); TTPV[c.id+'|'+t.length]=U; el.innerHTML=U.map(function(u){return '<img src="'+u+'" alt="" style="height:240px">';}).join(''); }catch(e){} }); }
  // 그림·영상 만들기. only 를 주면 그 부분만 다시 만든다: {cards:인스타·스레드 카드, blog:블로그 그림, dg:당근 배너, tt:틱톡 영상}
  function makeCards(ids,only){ if(!ids.length||BUSY.cards) return; BUSY.cards=true; var all=!only; only=only||{cards:1,blog:1,dg:1,tt:1}; var i=0, last=null, J=job('그리기 시작');
    function b64(cv){ return cv.toDataURL('image/jpeg',0.9).split(',')[1]; }
    function done(msg){ BUSY.cards=false; J.end(); if(last) D=last; render(); if(msg) say(msg); else if(TTERR){ say('틱톡용 영상은 만들지 못했어요: '+TTERR); TTERR=''; } else if(!all) say('다시 만들었어요.',true); }
    (function next(){ if(i>=ids.length) return done();
      var c=D.works.filter(function(x){return x.id===ids[i]})[0], st=c&&D.stores.filter(function(x){return x.code===c.store})[0]||{};
      if(!c){ i++; return next(); }
      var tag=' '+(i+1)+'/'+ids.length, urls=c.media.slice(), bu=(c.blogMedia||[]).slice(), dgu=c.dgMedia||'', L=null;
      var ttOn=(D.ttStores||'').split(/[\s,]+/).indexOf(c.store)>=0&&lfCards.video;
      var TL=[]; 
      J.set('사진 받는 중'+tag);
      // 표지에 깔 사진: 이 콘텐츠의 소재 이미지가 먼저, 없으면 매장이 보낸 사진을 차례로 돌려 쓴다
      _api({action:'admin_art',k:K,id:c.id}).then(function(a){ if(!a.ok) return {};
        var ord=Math.max(1,parseInt(c.order,10)||1), src=a.art[0]||(a.photos.length?a.photos[(ord-1)%a.photos.length]:''), src2=a.art[1]||(a.photos.length>1?a.photos[ord%a.photos.length]:'');
        var get=function(s){ if(!s) return Promise.resolve(null); return _api({action:'admin_art_data',k:K,id:c.id,src:s}).then(function(r){ return r.ok?lfCards.load(r.mime,r.data):null; }).catch(function(){return null;}); };
        return get(src).then(function(c1){ return get(src2).then(function(c2){ return {cover:c1,last:c2}; }); });
      }).catch(function(){ return {}; }).then(function(pic){ return (lfCards.logos?lfCards.logos('icons/'):Promise.resolve(null)).then(function(LG){ pic.logos=LG; return pic; }); }).then(function(pic){
        OPT={credit:!(st.plan&&st.plan.status==='유료')||/로컬피드/.test(st.name||''),logos:pic.logos,name:st.name||'',color:st.color||'',insta:st.insta||st.igName||'',kicker:st.industry||'',cover:pic.cover||null,last:pic.last||null};
        try{ TL=lfCards.ttFrames?lfCards.ttFrames(c.text['틱톡 제목·설명'],{name:st.name||'',color:st.color||'',cover:OPT.cover||null}):[]; }catch(e){ TL=[]; }
        // 카드는 인스타·스레드용으로 다시 만들 때, 또는 틱톡 대본이 없어 카드로 영상을 만들 때만 그린다
        var need=only.cards||(only.tt&&ttOn&&!TL.length);
        return need?(J.set('카드 그리는 중'+tag), lfCards.render(c.pages,OPT)):null;
      }).then(function(cards){ L=cards; if(!only.cards||!L) return; urls=[]; var n=0;
        return (function up(){ if(n>=L.length) return; J.set('카드 올리는 중'+tag+' · '+(n+1)+'/'+L.length+'장'); return _api({action:'admin_card',k:K,id:c.id,n:n+1,data:b64(L[n])}).then(function(r){ if(!r.ok) throw new Error(r.error); urls.push(r.url); n++; return up(); }); })();
      }).then(function(){ if(!only.blog) return; var B=[]; try{ OPT.title=c.title; OPT.blogText=c.text['블로그 글']||''; B=lfCards.blog?lfCards.blog(c.pages,OPT):[]; }catch(e){ B=[]; } if(!B.length) return; bu=[]; var bn=0;
        return (function upb(){ if(bn>=B.length) return; J.set('블로그 그림 올리는 중'+tag+' · '+(bn+1)+'/'+B.length+'장'); return _api({action:'admin_card',k:K,id:c.id,n:'b'+bn,data:b64(B[bn])}).then(function(r){ if(!r.ok) throw new Error(r.error); bu.push(r.url); bn++; return upb(); }); })();
      }).then(function(){ if(!only.dg||!c.text['당근 글']||!lfCards.daangn) return; var P=lfCards.daangn(c.text['당근 글'],c.title), cvd; J.set('당근 배너 올리는 중'+tag);
        try{ cvd=lfCards.daangnBanner(P,{name:st.name||'',color:st.color||'',kicker:st.industry||'',dong:st.online?'':(st.dong||''),cover:OPT.cover||null}); }catch(e){ return; }
        return _api({action:'admin_card',k:K,id:c.id,n:'d0',data:b64(cvd)}).then(function(r){ if(r.ok) dgu=r.url; },function(){});
      }).then(function(){ if(!only.tt||!ttOn) return; var src=TL.length?TL:L; if(!src||!src.length) return; J.set('틱톡용 영상 만드는 중'+tag);   // 틱톡 글에 장면 대본이 있으면 틱톡 전용 영상으로, 없으면 카드로
        return lfCards.video(src,{color:st.color||''}).then(function(bl){ return new Promise(function(ok,no){ var fr=new FileReader(); fr.onload=function(){ ok(String(fr.result).split(',')[1]); }; fr.onerror=no; fr.readAsDataURL(bl); }); })
          .then(function(b){ J.set('틱톡용 영상 올리는 중'+tag); return _api({action:'admin_card',k:K,id:c.id,n:'v',data:b}); }).then(function(r){ if(!r.ok) throw new Error(r.error); }).catch(function(e){ TTERR=e.message; });
      }).then(function(){ return _api({action:'admin_content',k:K,id:c.id,what:'edit',ch:'이미지 폴더',value:'게시용: '+urls.join(', ')+(bu.length?'\n블로그용: '+bu.join(', '):'')+(dgu?'\n당근용: '+dgu:'')});
      }).then(function(r){ if(!r.ok) throw new Error(r.error); last=norm(r); D=last; i++; next(); }).catch(function(e){ done('만들기가 멈췄어요: '+e.message); }); })(); }
  var JOBS={}, jn=0;
  function qleft(){ var q=D&&D.jobs; return q?(q.wait+q.run):0; }
  function drawJobs(){ var el=$('jobs'), k=Object.keys(JOBS), n=qleft(); el.hidden=!k.length&&!n; el.innerHTML=k.map(function(i){return '<div><i></i>'+esc(JOBS[i])+'</div>';}).join('')+(n?'<div><i></i>서버에서 작업 중 · 남은 '+n+'건'+(D.jobs.now?' · 지금 '+esc(D.jobs.now):'')+' · 창을 닫아도 계속돼요</div>':''); }
  // 서버 줄에 작업이 남아 있으면 20초마다 조용히 새로 읽는다
  var QT=null, QWAS=0;
  function qwatch(){ var n=qleft(); if(QWAS&&!n){ var f=(D.jobs.fail||[]).length; say(f?'맡긴 작업이 끝났어요. '+f+'건은 실패했어요. 대시보드에서 이유를 볼 수 있어요.':'맡긴 작업이 모두 끝났어요.',!f); } QWAS=n;
    if(n&&!QT) QT=setInterval(function(){ if(!K||!qleft()){ clearInterval(QT); QT=null; return; } if(document.querySelector('textarea:focus,input:focus')) return;
      _api({action:'admin_state',k:K}).then(function(r){ if(r.ok){ D=norm(r); render(); } }); },20000); }
  var SHT=null, CAPV={};
  function b64buf(b){ var s=atob(b), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
  function bufb64(buf){ var a=new Uint8Array(buf), s=''; for(var i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); }
  function shwatch(){ var run=(D&&D.shorts||[]).filter(function(x){return x.run;}), wr=Object.keys(D&&D.presenters||{}).filter(function(c){ var t=D.presenters[c].state; return t==='cands_wait'||t==='train'; }); if((!run.length&&!wr.length)||SHT||!K) return;
    SHT=setTimeout(function(){ SHT=null; if(!K) return; if(document.querySelector('textarea:focus,input:focus')) return shwatch();
      var was={}; run.forEach(function(x){was[x.id]=x.stage+'|'+x.pics;});
      var ws={}; wr.forEach(function(c){ws[c]=D.presenters[c].state;});
      wr.reduce(function(p,c){ return p.then(function(){ return _api({action:'admin_shorts',k:K,what:'who_check',store:c}).then(function(r){ if(r.ok) D=norm(r); }); }); },Promise.resolve()).then(function(){ return run.reduce(function(p,x){ return p.then(function(){ return _api({action:'admin_shorts',k:K,what:'check',id:x.id}).then(function(r){ if(r.ok) D=norm(r); }); }); },Promise.resolve()); }).then(function(){
        wr.forEach(function(c){ var t=((D.presenters||{})[c]||{}).state; if(t!==ws[c]) say(t==='cands'?'출연자 후보가 나왔어요. 골라 주세요.':t==='ready'?'출연자가 정해졌어요. 이제 장면 그림을 만들 수 있어요.':'출연자: '+(((D.presenters||{})[c]||{}).err||'다시 해 주세요.'),t==='cands'||t==='ready'); });
        (D.shorts||[]).forEach(function(x){ if(was[x.id]&&!x.run){ if(x.stage==='완성') say('쇼츠 영상이 완성됐어요.',true); else if(x.memo) say('쇼츠: '+x.memo); else say('장면 그림이 나왔어요.',true); } });
        render(); }).catch(function(){ shwatch(); }); },12000); }
  function queue(kind,items,label){ return _api({action:'admin_queue',what:'add',kind:kind,items:items,k:K}).then(function(r){ if(!r.ok) throw new Error(r.error); D=norm(r); render(); say(label+' '+items.length+'건을 서버에 맡겼어요. 창을 닫아도 계속되고, 끝나면 대시보드 할 일이 바뀌어요.',true); }).catch(function(e){ if(/^LOGIN/.test(e.message)) return logout(true); say(e.message); }); }
  function queueBox(){ var q=D.jobs||{}, f=q.fail||[], n=qleft(); if(!n&&!f.length) return '';
    return '<div class="box"><h2>서버에 맡긴 작업</h2>'+(n?'<div class="line"><div class="g"><b>남은 '+n+'건'+(q.now?' · 지금 '+esc(q.now):'')+'</b><small>한 건에 1~2분쯤 걸려요. 이 창을 닫아도 계속됩니다. 카드 그리기는 여기 포함되지 않아요.</small></div>'+(q.wait?'<button class="btn sm gray" data-q="cancel">아직 시작 안 한 '+q.wait+'건 취소</button>':'')+'</div>':'')+
      f.map(function(x){return '<div class="line"><div class="g"><b style="color:var(--bad)">실패 · '+esc(x.name)+' · '+esc(x.kind)+'</b><small>'+esc(x.msg)+'</small></div></div>';}).join('')+
      (f.length||q.done?'<div style="margin-top:10px"><button class="link" data-q="clear">끝난 기록 지우기</button></div>':'')+'</div>'; }
  function job(label){ var id=++jn; JOBS[id]=label; drawJobs(); return { set:function(t){ if(JOBS[id]!==undefined){JOBS[id]=t;drawJobs();} }, end:function(){ delete JOBS[id]; drawJobs(); } }; }
  window.addEventListener('beforeunload',function(e){ if(Object.keys(JOBS).length){ e.preventDefault(); e.returnValue=''; } });
  function call(body,btn){ say(''); var j=null; if(btn){ j=job((btn.dataset.job||btn.textContent.trim())+' · 처리 중'); btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='처리 중…';} body.k=K;
    return lfApi(body).then(function(r){ if(j) j.end(); if(!r.ok) throw new Error(r.error); D=r; render(); }, function(e){ if(j) j.end(); throw e; }).catch(function(e){ if(/^LOGIN/.test(e.message)){ logout(true); return; } say(e.message); if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;} }); }
  function logout(silent){ var k=K; K=null; D=null; try{localStorage.removeItem('lf_admin_s');}catch(e){} if(k&&!silent) _api({action:'admin_logout',k:k}); login(silent?'로그인이 풀렸어요. 다시 로그인해 주세요.':''); }
  function login(m){
    document.querySelector('.side').hidden=true;
    $('view').innerHTML='<div class="card" style="max-width:380px;margin:8vh auto 0"><div class="brand" style="padding:0 0 14px"><img src="icons/logo.svg" alt=""><b>로컬피드</b><span>운영 화면</span></div><form id="lf"><label class="fld"><span>아이디</span><input class="in" id="aid" autocomplete="username" autocapitalize="off"></label><label class="fld"><span>비밀번호</span><input class="in" id="apw" type="password" autocomplete="current-password"></label><button class="btn" id="ago">로그인</button></form><small style="display:block;margin-top:12px;color:var(--s)">처음이면 시트 메뉴 로컬피드 → "9. 운영 화면 로그인 정하기"에서 아이디와 비밀번호를 먼저 정해 주세요.</small></div>';
    say(m||'');
    $('lf').onsubmit=function(ev){ ev.preventDefault(); var b=$('ago'); b.disabled=true; b.textContent='확인 중…'; say('');
      _api({action:'admin_login',id:$('aid').value.trim(),pw:$('apw').value}).then(function(r){ if(!r.ok) throw new Error(r.error); K=r.k; try{localStorage.setItem('lf_admin_s',K);}catch(e){} document.querySelector('.side').hidden=false; $('view').innerHTML='<div class="lfload"><img src="icons/logo.svg" alt=""><i></i><i></i><i></i></div>'; return call({action:'admin_state'}); })
      .catch(function(e){ say(e.message); b.disabled=false; b.textContent='로그인'; }); };
  }
  function ico(p){return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var NAV=[['dash','대시보드','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['stores','매장','<path d="M4 10v10h16V10M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/>'],['week','이번 주 일정','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['pubs','발행 기록','<path d="M4 12l16-8-6 16-3-6z"/>'],['set','연결 · 설정','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']];
  var KEYS=['place','intro','photos','voice','blog','daangn','igbiz','ig','th','tt'];
  var KNAME={place:'매장 정보',intro:'가게 소개',photos:'사진·얼굴',voice:'목소리',blog:'블로그 주소',daangn:'당근',igbiz:'인스타 비즈니스 전환',ig:'인스타 연결',th:'스레드 연결',tt:'틱톡 연결'};
  function ok(v){return v==='done'||v==='later'||v==='skip';}
  function nDone(s){return KEYS.filter(function(k){return ok(s.steps[k])}).length;}
  function chip(state,doneText){ return state==='done'?'<span class="chip ok">'+esc(doneText||'완료')+'</span>':state==='sent'?'<span class="chip warn">수락 필요</span>':state==='later'?'<span class="chip warn">나중에</span>':state==='skip'?'<span class="chip">안 씀</span>':'<span class="chip">대기</span>'; }
  function logo(f){return '<div class="tile logo"><img src="icons/'+f+'" alt=""></div>';}
  function md(x){var p=String(x||'').split('-');return p.length===3?(+p[1])+'-'+(+p[2]):'';}
  function plan(s){

    [].forEach.call(document.querySelectorAll('[data-pubnow]'),function(b){b.onclick=function(){ if(!window.confirm('인스타와 스레드'+(D.ttReady&&(D.ttStores||'').split(/[\s,]+/).indexOf((D.works.filter(function(x){return x.id===b.dataset.pubnow;})[0]||{}).store)>=0?'(틱톡은 초안으로)':'')+'에 지금 올릴까요? 당근과 블로그는 자동으로 올라가지 않아요. 올린 뒤에는 되돌릴 수 없습니다.')) return; b.dataset.job='지금 올리기'; call({action:'admin_publish',id:b.dataset.pubnow},b).then(function(){ if(D&&D.notice) say(D.notice,!/실패|없습니다/.test(D.notice)); }); b.textContent='올리는 중… 1분쯤'; };});
    [].forEach.call(document.querySelectorAll('[data-art]'),function(b){b.onclick=function(){ var c=D.works.filter(function(x){return x.id===b.dataset.art})[0]; var v=window.prompt('표지에 깔 이미지 주소를 넣어 주세요. 두 개면 쉼표로 나눕니다(둘째는 마지막 장).\n비우면 매장 사진을 씁니다.',c?c.art:''); if(v===null) return; var id=b.dataset.art; b.dataset.job='소재 이미지 저장'; call({action:'admin_content',id:id,what:'edit',ch:'소재 이미지',value:v.trim()},b).then(function(){ makeCards([id]); }); };});
    [].forEach.call(document.querySelectorAll('[data-wdo]'),function(b){b.onclick=function(){ var w=D.works.filter(function(x){return x.id===b.dataset.id})[0]; if(b.dataset.wdo==='send'&&w&&!/^쇼츠/.test(w.form)&&!w.media.length&&!window.confirm('카드 이미지가 아직 없어요. 글만 먼저 매장에 보낼까요?\n(취소하고 "카드 만들기"를 먼저 누르는 것을 권해요)')) return; call({action:'admin_content',id:b.dataset.id,what:b.dataset.wdo},b); };});
    [].forEach.call(document.querySelectorAll('[data-wedit]'),function(b){b.onclick=function(){ editW=b.dataset.wedit||null; if(editW) openW=editW.split('|')[0]; render(); };});
    [].forEach.call(document.querySelectorAll('[data-wsave]'),function(b){b.onclick=function(){ var k=b.dataset.wsave.split('|'), v=$('wT').value; editW=null; call({action:'admin_content',id:k[0],what:'edit',ch:k[1],value:v},b); };});
    [].forEach.call(document.querySelectorAll('[data-wrev]'),function(b){b.onclick=function(){ var ask=''; if(!b.dataset.auto){ ask=window.prompt('어떻게 고칠까요? 말하듯 적어 주세요.\n예: 더 짧게, 가격 이야기는 빼고',''); if(!ask) return; } else if(!window.confirm('매장 대표님이 남긴 말대로 고칠까요?')) return; var wid=b.dataset.wrev; b.dataset.job='완성본 고치기'; call({action:'admin_content',id:wid,what:'revise',ch:b.dataset.ch||'',value:ask},b).then(function(){ var c=D&&D.works.filter(function(x){return x.id===wid})[0]; if(c&&!c.media.length&&c.pages&&!/^쇼츠/.test(c.form)) makeCards([wid]); }); b.textContent='고치는 중…'; };});
    [].forEach.call(document.querySelectorAll('[data-planweek]'),function(b){b.onclick=function(){ if(window.confirm('이 주 기획을 매장 대표님 화면에 보낼까요?')) call({action:'admin_plan_week',store:b.dataset.store,week:b.dataset.planweek},b); };});
    var add=$('add'); if(add) add.onclick=function(){ call({action:'admin_add',name:$('nName').value,dong:$('nDong').value,industry:$('nInd').value},add); };
  }
  function norm(r){ r.shorts=r.shorts||[]; r.presenters=r.presenters||{}; r.jobs=r.jobs||{wait:0,run:0,done:0,fail:[]}; r.industries=r.industries||[]; r.plans=r.plans||[]; r.works=r.works||[]; (r.stores||[]).forEach(function(s){ s.profile=s.profile||{}; }); r.contents=r.contents||[]; r.publishes=r.publishes||[]; r.sheet=r.sheet||'#'; r.stores.forEach(function(s){s.plan=s.plan||{status:'시작 전'};s.files=s.files||{store:0,face:0,voice:0};s.steps.intro=s.steps.intro||'todo';s.steps.voice=s.steps.voice||'todo';}); return r; }
  var _api=window.lfApi; window.lfApi=function(b){return _api(b).then(function(r){return r&&r.ok&&r.stores?norm(r):r;});};
  var lo=document.createElement('button'); lo.className='btn sm gray'; lo.textContent='로그아웃'; lo.style.marginTop='8px'; lo.onclick=function(){logout(false);}; document.querySelector('.side').appendChild(lo);
  $('reload').onclick=function(){call({action:'admin_state'},$('reload'));};
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&D) call({action:'admin_state'}); });
  if(!K){ login(''); return; }
  call({action:'admin_state'}).then(function(){ if(!D&&K) $('view').innerHTML='<h1>열 수 없습니다</h1>'; });
})();
