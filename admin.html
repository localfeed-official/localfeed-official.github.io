<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>(새 화면 시안) 로컬피드 운영</title>
<link rel="icon" href="icons/logo.svg">
<link rel="stylesheet" href="a.css?v=1127s">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="icons/logo.svg" alt=""><div><b>로컬피드</b><span>운영 화면 · 하이브릭</span></div></div>
    <nav id="nav"></nav>
    <button class="btn sm gray" id="reload" style="margin-top:auto">새로고침</button>
  </aside>
  <main class="main">
    <div id="topbar" hidden><label>보는 범위 <select id="sf"></select></label><span id="tbnote"></span></div>
    <p class="msg" id="msg"></p>
    <div id="jobs" hidden></div>
    <div id="view"><h1>불러오는 중…</h1></div>
  </main>
</div>
<script src="config.js"></script>
<script src="cards.js?v=1127q"></script>
<script>
(function(){
  var K=null;
  try{K=localStorage.getItem('lf_admin_s'); localStorage.removeItem('lf_admin');}catch(e){}
  if(location.search) history.replaceState(null,'',location.pathname);
  var $=function(id){return document.getElementById(id)}, D=null, tab='dash', cur=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(t,good){var m=$('msg'); m.textContent=t||''; m.className=t?('msg banner'+(good?' good':'')):'msg'; if(t){ try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);} }}
  function copy(t,btn){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){var o=btn.textContent;btn.textContent='복사됨';setTimeout(function(){btn.textContent=o},1200);}).catch(function(){window.prompt('길게 눌러 복사하세요',t);}); }
  function cost(code){ var u=((D.usage||{}).month||{})[code]||0; return '약 '+Math.round(u*1450).toLocaleString()+'원'; }
  var BUSY={make:false,cards:false,bulk:false};
  // 글 만들기: 한 건마다 짧은 글 → 블로그 글 순서로 따로 요청한다. 메뉴를 옮겨도 계속 돈다.
  function makeTexts(rows){ if(BUSY.make) return; BUSY.make=true; var i=0, J=job('글 만들기 시작');
    function stop(msg){ BUSY.make=false; J.end(); render(); if(msg) say(msg); }
    (function next(){ if(i>=rows.length) return stop('');
      J.set('글 만드는 중 '+(i+1)+'/'+rows.length+' · 다른 메뉴를 봐도 계속 돼요');
      _api({action:'admin_make_one',k:K,row:rows[i]}).then(function(r){ if(!r.ok) throw new Error(r.error); D=norm(r); render();
        var need=D.works.filter(function(c){return !c.text['블로그 글'];}).map(function(c){return c.id;});
        return (function blog(n){ if(n>=need.length) return null; J.set('블로그 글 쓰는 중 '+(i+1)+'/'+rows.length);
          return _api({action:'admin_make_blog',k:K,id:need[n]}).then(function(r2){ if(r2.ok){ D=norm(r2); render(); } return blog(n+1); }); })(0);
      }).then(function(){ i++; next(); }).catch(function(e){ stop((i+1)+'번째에서 멈췄어요: '+e.message+' (이미 만든 것은 남아 있어요. 다시 누르면 남은 것부터 만듭니다)'); }); })(); }
  var OPT={}, TTERR='', REPOST='';
  function makeCards(ids){ if(!ids.length||BUSY.cards) return; BUSY.cards=true; var i=0, last=null, J=job('카드 그리기 시작');
    function b64(cv){ return cv.toDataURL('image/jpeg',0.9).split(',')[1]; }
    (function next(){ if(i>=ids.length){ BUSY.cards=false; J.end(); if(last) D=last; render(); if(TTERR){ say('카드는 만들었지만 틱톡용 영상은 만들지 못했어요: '+TTERR); TTERR=''; } return; }
      var c=D.works.filter(function(x){return x.id===ids[i]})[0], st=c&&D.stores.filter(function(x){return x.code===c.store})[0]||{};
      if(!c){ i++; return next(); }
      J.set('카드 그리는 중 '+(i+1)+'/'+ids.length);
      // 표지에 깔 사진: 이 콘텐츠의 소재 이미지가 먼저, 없으면 매장이 보낸 사진을 차례로 돌려 쓴다
      _api({action:'admin_art',k:K,id:c.id}).then(function(a){ if(!a.ok) return {};
        var ord=Math.max(1,parseInt(c.order,10)||1), src=a.art[0]||(a.photos.length?a.photos[(ord-1)%a.photos.length]:''), src2=a.art[1]||(a.photos.length>1?a.photos[ord%a.photos.length]:'');
        var get=function(s){ if(!s) return Promise.resolve(null); return _api({action:'admin_art_data',k:K,id:c.id,src:s}).then(function(r){ return r.ok?lfCards.load(r.mime,r.data):null; }).catch(function(){return null;}); };
        J.set('사진 받는 중 '+(i+1)+'/'+ids.length);
        return get(src).then(function(c1){ return get(src2).then(function(c2){ return {cover:c1,last:c2}; }); });
      }).catch(function(){ return {}; }).then(function(pic){ return (lfCards.logos?lfCards.logos('icons/'):Promise.resolve(null)).then(function(LG){ pic.logos=LG; return pic; }); }).then(function(pic){ return lfCards.render(c.pages,OPT={credit:!(st.plan&&st.plan.status==='유료')||/로컬피드/.test(st.name||''),logos:pic.logos,name:st.name||'',color:st.color||'',insta:st.insta||st.igName||'',kicker:st.industry||'',cover:pic.cover||null,last:pic.last||null}); }).then(function(L){ var urls=[], n=0;
        return (function up(){ if(n>=L.length){ // 카드를 다 올렸으면 블로그용 그림(대표 1장 + 본문 그림)을 그려 올린다
            var B=[]; try{ OPT.title=c.title; OPT.blogText=c.text['블로그 글']||''; B=lfCards.blog?lfCards.blog(c.pages,OPT):[]; }catch(e){ B=[]; } var bu=[], bn=0;
            var dgu='';
            var fin=function(){ return _api({action:'admin_content',k:K,id:c.id,what:'edit',ch:'이미지 폴더',value:'게시용: '+urls.join(', ')+(bu.length?'\n블로그용: '+bu.join(', '):'')+(dgu?'\n당근용: '+dgu:'')}); };
            // 당근 소식 대표 이미지(배너): 당근 글 맨 위의 "배너:" 줄로 그린다
            var dgb=function(){ var P=lfCards.daangn?lfCards.daangn(c.text['당근 글'],c.title):null; if(!P||!c.text['당근 글']) return Promise.resolve(); J.set('당근 배너 올리는 중 '+(i+1)+'/'+ids.length);
              var cvd; try{ cvd=lfCards.daangnBanner(P,{name:st.name||'',color:st.color||'',kicker:st.industry||'',dong:st.online?'':(st.dong||''),cover:OPT.cover||null}); }catch(e){ return Promise.resolve(); }
              return _api({action:'admin_card',k:K,id:c.id,n:'d0',data:b64(cvd)}).then(function(r){ if(r.ok) dgu=r.url; },function(){}); };
            // 틱톡을 켠 매장이면 카드를 세로 영상으로 묶어 올린다(틱톡 초안용). 실패해도 카드는 만든 것으로 둔다.
            var tt=(D.ttStores||'').split(/[\s,]+/).indexOf(c.store)>=0&&lfCards.video;
            var vid=function(){ if(!tt) return fin(); J.set('틱톡용 영상 만드는 중 '+(i+1)+'/'+ids.length+' · 잠시만요');
              var TL=[]; try{ TL=lfCards.ttFrames?lfCards.ttFrames(c.text['틱톡 제목·설명'],{name:st.name||'',color:st.color||'',cover:OPT.cover||null}):[]; }catch(e){ TL=[]; }
              return lfCards.video(TL.length?TL:L,{color:st.color||''})   /* 틱톡 글에 장면 대본이 있으면 틱톡 전용 영상으로, 없으면 카드로 */.then(function(bl){ return new Promise(function(ok,no){ var fr=new FileReader(); fr.onload=function(){ ok(String(fr.result).split(',')[1]); }; fr.onerror=no; fr.readAsDataURL(bl); }); })
                .then(function(b){ J.set('틱톡용 영상 올리는 중 '+(i+1)+'/'+ids.length); return _api({action:'admin_card',k:K,id:c.id,n:'v',data:b}); }).then(function(r){ if(!r.ok) throw new Error(r.error); },function(e){ TTERR=e.message; }).then(fin); };
            return (function upb(){ if(bn>=B.length) return dgb().then(vid);
              J.set('블로그 그림 올리는 중 '+(i+1)+'/'+ids.length+' · '+(bn+1)+'/'+B.length+'장'); return _api({action:'admin_card',k:K,id:c.id,n:'b'+bn,data:b64(B[bn])}).then(function(r){ if(!r.ok) throw new Error(r.error); bu.push(r.url); bn++; return upb(); }); })(); }
          J.set('카드 올리는 중 '+(i+1)+'/'+ids.length+' · '+(n+1)+'/'+L.length+'장'); return _api({action:'admin_card',k:K,id:c.id,n:n+1,data:b64(L[n])}).then(function(r){ if(!r.ok) throw new Error(r.error); urls.push(r.url); n++; return up(); }); })();
      }).then(function(r){ if(!r.ok) throw new Error(r.error); last=norm(r); D=last; i++; next(); }).catch(function(e){ BUSY.cards=false; J.end(); if(last) D=last; render(); say('카드 만들기가 멈췄어요: '+e.message); }); })(); }
  var JOBS={}, jn=0;
  function qleft(){ var q=D&&D.jobs; return q?(q.wait+q.run):0; }
  function drawJobs(){ var el=$('jobs'), k=Object.keys(JOBS), n=qleft(); el.hidden=!k.length&&!n; el.innerHTML=k.map(function(i){return '<div><i></i>'+esc(JOBS[i])+'</div>';}).join('')+(n?'<div><i></i>서버에서 작업 중 · 남은 '+n+'건'+(D.jobs.now?' · 지금 '+esc(D.jobs.now):'')+' · 창을 닫아도 계속돼요</div>':''); }
  // 서버 줄에 작업이 남아 있으면 20초마다 조용히 새로 읽는다
  var QT=null, QWAS=0;
  function qwatch(){ var n=qleft(); if(QWAS&&!n){ var f=(D.jobs.fail||[]).length; say(f?'맡긴 작업이 끝났어요. '+f+'건은 실패했어요. 대시보드에서 이유를 볼 수 있어요.':'맡긴 작업이 모두 끝났어요.',!f); } QWAS=n;
    if(n&&!QT) QT=setInterval(function(){ if(!K||!qleft()){ clearInterval(QT); QT=null; return; } if(document.querySelector('textarea:focus,input:focus')) return;
      _api({action:'admin_state',k:K}).then(function(r){ if(r.ok){ D=norm(r); render(); } }); },20000); }
  function queue(kind,items,label){ return _api({action:'admin_queue',what:'add',kind:kind,items:items,k:K}).then(function(r){ if(!r.ok) throw new Error(r.error); D=norm(r); render(); say(label+' '+items.length+'건을 서버에 맡겼어요. 창을 닫아도 계속되고, 끝나면 대시보드 할 일이 바뀌어요.',true); }).catch(function(e){ if(/^LOGIN/.test(e.message)) return logout(true); say(e.message); }); }
  function queueBox(){ var q=D.jobs||{}, f=q.fail||[], n=qleft(); if(!n&&!f.length) return '';
    return '<div class="box"><h2>서버에 맡긴 작업</h2>'+(n?'<div class="line"><div class="g"><b>남은 '+n+'건'+(q.now?' · 지금 '+esc(q.now):'')+'</b><small>한 건에 1~2분쯤 걸려요. 이 창을 닫아도 계속됩니다. 카드 그리기는 여기 포함되지 않아요.</small></div>'+(q.wait?'<button class="btn sm gray" data-q="cancel">아직 시작 안 한 '+q.wait+'건 취소</button>':'')+'</div>':'')+
      f.map(function(x){return '<div class="line"><div class="g"><b style="color:var(--bad)">실패 · '+esc(x.name)+' · '+esc(x.kind)+'</b><small>'+esc(x.msg)+'</small></div></div>';}).join('')+
      (f.length||q.done?'<div style="margin-top:10px"><button class="link" data-q="clear">끝난 기록 지우기</button></div>':'')+'</div>'; }
  function job(label){ var id=++jn; JOBS[id]=label; drawJobs(); return { set:function(t){ if(JOBS[id]!==undefined){JOBS[id]=t;drawJobs();} }, end:function(){ delete JOBS[id]; drawJobs(); } }; }
  window.addEventListener('beforeunload',function(e){ if(Object.keys(JOBS).length){ e.preventDefault(); e.returnValue=''; } });
  function call(body,btn){ say(''); var j=null; if(btn){ j=job((btn.dataset.job||btn.textContent.trim())+' · 처리 중'); btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='처리 중…';} body.k=K;
    return lfApi(body).then(function(r){ if(j) j.end(); if(!r.ok) throw new Error(r.error); D=r; render(); }, function(e){ if(j) j.end(); throw e; }).catch(function(e){ if(/^LOGIN/.test(e.message)){ logout(true); return; } say(e.message); if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;} }); }
  function logout(silent){ var k=K; K=null; D=null; try{localStorage.removeItem('lf_admin_s');}catch(e){} if(k&&!silent) _api({action:'admin_logout',k:k}); login(silent?'로그인이 풀렸어요. 다시 로그인해 주세요.':''); }
  function login(m){
    document.querySelector('.side').hidden=true;
    $('view').innerHTML='<div class="card" style="max-width:380px;margin:8vh auto 0"><div class="brand" style="padding:0 0 14px"><img src="icons/logo.svg" alt=""><b>로컬피드</b><span>운영 화면</span></div><form id="lf"><label class="fld"><span>아이디</span><input class="in" id="aid" autocomplete="username" autocapitalize="off"></label><label class="fld"><span>비밀번호</span><input class="in" id="apw" type="password" autocomplete="current-password"></label><button class="btn" id="ago">로그인</button></form><small style="display:block;margin-top:12px;color:var(--s)">처음이면 시트 메뉴 로컬피드 → "9. 운영 화면 로그인 정하기"에서 아이디와 비밀번호를 먼저 정해 주세요.</small></div>';
    say(m||'');
    $('lf').onsubmit=function(ev){ ev.preventDefault(); var b=$('ago'); b.disabled=true; b.textContent='확인 중…'; say('');
      _api({action:'admin_login',id:$('aid').value.trim(),pw:$('apw').value}).then(function(r){ if(!r.ok) throw new Error(r.error); K=r.k; try{localStorage.setItem('lf_admin_s',K);}catch(e){} document.querySelector('.side').hidden=false; $('view').innerHTML='<h1>불러오는 중…</h1>'; return call({action:'admin_state'}); })
      .catch(function(e){ say(e.message); b.disabled=false; b.textContent='로그인'; }); };
  }
  function ico(p){return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var NAV=[['dash','대시보드','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['stores','매장','<path d="M4 10v10h16V10M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/>'],['week','이번 주 일정','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['pubs','발행 기록','<path d="M4 12l16-8-6 16-3-6z"/>'],['set','연결 · 설정','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']];
  var KEYS=['place','intro','photos','voice','blog','daangn','igbiz','ig','th','tt'];
  var KNAME={place:'매장 정보',intro:'가게 소개',photos:'사진·얼굴',voice:'목소리',blog:'블로그 주소',daangn:'당근',igbiz:'인스타 비즈니스 전환',ig:'인스타 연결',th:'스레드 연결',tt:'틱톡 연결'};
  function ok(v){return v==='done'||v==='later'||v==='skip';}
  function nDone(s){return KEYS.filter(function(k){return ok(s.steps[k])}).length;}
  function chip(state,doneText){ return state==='done'?'<span class="chip ok">'+esc(doneText||'완료')+'</span>':state==='sent'?'<span class="chip warn">수락 필요</span>':state==='later'?'<span class="chip warn">나중에</span>':state==='skip'?'<span class="chip">안 씀</span>':'<span class="chip">대기</span>'; }
  function logo(f){return '<div class="tile logo"><img src="icons/'+f+'" alt=""></div>';}
  function md(x){var p=String(x||'').split('-');return p.length===3?(+p[1])+'-'+(+p[2]):'';}
  function plan(s){
    var p=s.plan||{status:'시작 전'}, b=function(what,t,cls){return ' <button class="btn sm '+(cls||'gray')+'" style="padding:6px 9px;font-size:12px;display:inline-flex" data-done="'+what+'" data-store="'+esc(s.code)+'">'+t+'</button>';};
    if(p.status==='시작 전') return '<span class="chip">시작 전</span>'+b('trial_start','체험 시작','sec');
    if(p.status==='무료 체험') return '<span class="chip '+(p.over?'bad':p.left<=3?'warn':'soft')+'">무료 '+(p.over?'끝남':'D-'+p.left)+'</span> <small style="display:inline">'+md(p.trialEnd)+'까지</small>'+b('paid','입금 확인');
    if(p.status==='유료') return '<span class="chip '+(p.over?'bad':'ok')+'">유료'+(p.fee?' '+esc(p.fee):'')+'</span> <small style="display:inline">다음 결제 '+md(p.nextPay)+'</small>'+b('paid','입금 확인')+b('stop','중지');
    return '<span class="chip bad">중지</span>'+b('paid','입금 확인');
  }
  function payMsg(t){ return '[로컬피드] '+t.name+' 대표님, '+(t.kind==='trial'?'무료 체험이 ':'이번 달 이용 기간이 ')+md(t.end).replace('-','월 ')+'일에 끝납니다. 계속 이용하시려면'+(t.fee?' 월 '+t.fee+'을':'')+' 입금 후 알려 주세요. 감사합니다.'; }
  function research(s){
    if(s.refRunning) return '<span class="chip soft">조사 중</span>';
    if(s.research) return '<span class="chip '+(s.refs?'ok':'warn')+'">'+(s.refs?'레퍼런스 '+s.refs+'건':'결과 대기')+'</span>';
    return s.steps.intro==='done'?'<span class="chip warn">조사 시작 전</span>':'<span class="chip">가게 소개 대기</span>';
  }
  function stage(s){ // 지금 어느 단계인지 한 단어로
    var n=nDone(s); if(n<KEYS.length) return ['시작하기 '+n+'/'+KEYS.length,'soft'];
    if(!s.research) return ['조사 시작 전','warn']; if(s.refRunning) return ['조사 중','soft'];
    var c=D.contents.filter(function(x){return x.store===s.code}).length; if(!c) return ['기획 만들 차례','warn'];
    return ['콘텐츠 '+c+'개','ok'];
  }
  var FIL='', OPENG={}, SEL={}, Q='', ONLY=false, STAB='todo', REFS={}, editP=null;
  var PK=[['인스타 이름',30,'인스타 → 프로필 편집 → 이름'],['인스타 소개',150,'인스타 → 프로필 편집 → 소개'],['스레드 소개',150,'스레드 → 프로필 편집 → 소개'],['틱톡 이름',30,'틱톡 → 프로필 편집 → 이름'],['틱톡 소개',80,'틱톡 → 프로필 편집 → 소개'],['당근 소개',200,'당근비즈니스 → 비즈프로필 → 소개'],['당근 단골 혜택',40,'당근비즈니스 → 비즈프로필 → 업체 정보 → 단골 혜택'],['블로그 소개',200,'네이버 블로그 → 관리 → 블로그 정보 → 소개글']];
  // 이번 주 일정: 날짜별로 어느 매장의 무엇이 올라가는지
  function refsHtml(s){ var R=REFS[s.code];

    [].forEach.call(document.querySelectorAll('[data-wrev]'),function(b){b.onclick=function(){ var ask=''; if(!b.dataset.auto){ ask=window.prompt('어떻게 고칠까요? 말하듯 적어 주세요.\n예: 더 짧게, 가격 이야기는 빼고',''); if(!ask) return; } else if(!window.confirm('매장 대표님이 남긴 말대로 고칠까요?')) return; var wid=b.dataset.wrev; b.dataset.job='완성본 고치기'; call({action:'admin_content',id:wid,what:'revise',ch:b.dataset.ch||'',value:ask},b).then(function(){ var c=D&&D.works.filter(function(x){return x.id===wid})[0]; if(c&&!c.media.length&&c.pages&&!/^쇼츠/.test(c.form)) makeCards([wid]); }); b.textContent='고치는 중…'; };});

    var add=$('add'); if(add) add.onclick=function(){ call({action:'admin_add',name:$('nName').value,dong:$('nDong').value,industry:$('nInd').value},add); };
  }
  function norm(r){ r.jobs=r.jobs||{wait:0,run:0,done:0,fail:[]}; r.industries=r.industries||[]; r.plans=r.plans||[]; r.works=r.works||[]; (r.stores||[]).forEach(function(s){ s.profile=s.profile||{}; }); r.contents=r.contents||[]; r.publishes=r.publishes||[]; r.sheet=r.sheet||'#'; r.stores.forEach(function(s){s.plan=s.plan||{status:'시작 전'};s.files=s.files||{store:0,face:0,voice:0};s.steps.intro=s.steps.intro||'todo';s.steps.voice=s.steps.voice||'todo';}); return r; }
  var _api=window.lfApi; window.lfApi=function(b){return _api(b).then(function(r){return r&&r.ok&&r.stores?norm(r):r;});};
